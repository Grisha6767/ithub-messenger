  function sendFileFromBlob(file, name) {
    const formData = new FormData();
    formData.append('file', file, name);
    const tempId = 'temp_' + (++messageCounter) + '_' + Date.now();
    pendingMessages.add(tempId);

    fetch('/upload', { method: 'POST', body: formData })
      .then(res => res.json())
      .then(data => {
        const replyToId = replyingTo ? replyingTo.id : null;
        if (currentGroupId) {
          const msgData = { from_user: currentUser.id, text: '', file: data.filename, timestamp: new Date(), tempId, reply_to: replyToId, reactions: [] };
          currentMessages.push(msgData);
          addMessage(msgData, 'my', true);
          socket.emit('group-message', {
            groupId: currentGroupId, topicId: currentTopicId,
            from: currentUser.id, text: '', file: data.filename, tempId, replyTo: replyToId
          });
        } else {
          const msgData = { from_user: currentUser.id, to_user: currentContactId, text: '', file: data.filename, timestamp: new Date(), tempId, reply_to: replyToId, reactions: [] };
          currentMessages.push(msgData);
          addMessage(msgData, 'my', false);
          socket.emit('message', {
            from: currentUser.id, to: currentContactId, text: '', file: data.filename, tempId, replyTo: replyToId
          });
        }
        cancelReply();
      })
      .catch(err => console.error(err));
  }

  // ===== ГОЛОС =====
  async function toggleRecording() {
    if (isRecording) stopRecording(); else await startRecording();
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      let mimeType = 'audio/webm';
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType = 'audio/webm;codecs=opus';
      else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
      else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';

      mediaRecorder = new MediaRecorder(stream, { mimeType });
      audioChunks = [];
      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: mimeType });
        let ext = 'webm';
        if (mimeType.includes('mp4')) ext = 'm4a';
        sendVoiceMessage(audioBlob, ext);
      };
      mediaRecorder.start();
      isRecording = true;
      voiceBtn.style.color = '#FF4757';
    } catch (err) { console.error(err); alert('Разрешите доступ к микрофону'); }
  }

  function stopRecording() {
    if (mediaRecorder) {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(track => track.stop());
      isRecording = false;
      voiceBtn.style.color = '';
    }
  }

  function sendVoiceMessage(blob, ext = 'webm') {
    if (!currentContactId && !currentGroupId) return;
    const formData = new FormData();
    formData.append('file', blob, `voice_${Date.now()}.${ext}`);
    const tempId = 'temp_' + (++messageCounter) + '_' + Date.now();
    pendingMessages.add(tempId);

    fetch('/upload', { method: 'POST', body: formData })
      .then(res => res.json())
      .then(data => {
        if (currentGroupId) {
          const msgData = { from_user: currentUser.id, text: '', voice: data.filename, timestamp: new Date(), tempId, reactions: [] };
          currentMessages.push(msgData);
          addMessage(msgData, 'my', true);
          socket.emit('group-message', {
            groupId: currentGroupId, topicId: currentTopicId,
            from: currentUser.id, text: '', voice: data.filename, tempId
          });
        } else {
          const msgData = { from_user: currentUser.id, to_user: currentContactId, text: '', voice: data.filename, timestamp: new Date(), tempId, reactions: [] };
          currentMessages.push(msgData);
          addMessage(msgData, 'my', false);
          socket.emit('message', {
            from: currentUser.id, to: currentContactId, text: '', voice: data.filename, tempId
          });
        }
      })
      .catch(err => console.error(err));
  }

  function createVoicePlayer(fileName) {
    const container = document.createElement('div');
    container.className = 'voice-message';
    const playBtn = document.createElement('button');
    playBtn.className = 'voice-play-btn';
    playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
    const wave = document.createElement('div');
    wave.className = 'voice-wave';
    for (let i = 0; i < 20; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = (8 + Math.random() * 16) + 'px';
      wave.appendChild(bar);
    }
    const timeLabel = document.createElement('span');
    timeLabel.className = 'voice-time';
    timeLabel.textContent = '0:00';

    const audio = document.createElement('audio');
    audio.src = '/uploads/' + fileName;
    audio.preload = 'metadata';
    audio.setAttribute('playsinline', '');
    audio.load();

    audio.addEventListener('loadedmetadata', () => { if (isFinite(audio.duration)) timeLabel.textContent = formatTime(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      const current = audio.currentTime;
      timeLabel.textContent = formatTime(current);
      const totalBars = wave.children.length;
      const playedBars = Math.floor((current / audio.duration) * totalBars) || 0;
      wave.querySelectorAll('.bar').forEach((bar, i) => { bar.classList.toggle('played', i < playedBars); });
    });
    audio.addEventListener('ended', () => {
      playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
      timeLabel.textContent = formatTime(audio.duration);
      wave.querySelectorAll('.bar').forEach(bar => bar.classList.remove('played'));
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
      } else {
        audio.pause();
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
      }
    });

    container.appendChild(playBtn);
    container.appendChild(wave);
    container.appendChild(timeLabel);
    return container;
  }

  function formatTime(seconds) {
    if (!isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  // ===== ПОИСК =====
  function toggleSearchMessages() {
    searchMessagesPanel.classList.toggle('show');
    if (searchMessagesPanel.classList.contains('show')) searchMessagesInput.focus();
    else {
      searchMessagesInput.value = '';
      searchQuery = '';
      searchMessagesCount.textContent = '';
      messagesArea.querySelectorAll('.message-wrapper').forEach(w => w.style.display = '');
    }
  }
  function searchInMessages() {
    searchQuery = searchMessagesInput.value.toLowerCase().trim();
    const items = messagesArea.querySelectorAll('.message-wrapper');
    let count = 0;
    items.forEach(w => {
      const text = w.querySelector('.message-bubble')?.textContent?.toLowerCase() || '';
      const match = !searchQuery || text.includes(searchQuery);
      w.style.display = match ? '' : 'none';
      if (match && searchQuery) count++;
    });
    searchMessagesCount.textContent = searchQuery ? `Найдено: ${count}` : '';
  }

  function createGroup() {

    const description = document.getElementById('group-description').value.trim();

    const memberIds = Array.from(document.querySelectorAll('#members-selector input[type="checkbox"]:checked'))
      .map(cb => parseInt(cb.value));

    fetch('/groups/create', {

  // ===== ВЕТКИ =====

    if (!currentGroupId) return;
    const group = groups.find(g => g.id === currentGroupId);
    if (!group || group.creator_id !== currentUser.id) return;

    const topic = currentGroupTopics.find(t => t.id === currentTopicId);

    const group = groups.find(g => g.id === currentGroupId);

      .then(res => res.json())

            <div class="member-checkbox member-row" style="cursor:default;" data-name="${m.fullName.toLowerCase()}" data-group="${(m.group || '').toLowerCase()}">
              <div class="member-mini-avatar">
                ${m.avatar ? `<img src="/uploads/${m.avatar}" />` : getInitials(m.fullName)}
                ${onlineClass ? `<span class="mini-online-dot${onlineClass}" data-user-id="${m.id}"></span>` : ''}
              </div>
              <div class="member-mini-info">
                <div class="member-mini-name">${m.fullName} ${m.group_role === 'admin' ? '👑' : ''}</div>

        modalBody.innerHTML = `
          ${isCreator ? `

              <div class="group-avatar-big" onclick="chooseGroupAvatar()">
                ${avatarHtml}
                <div class="overlay">Сменить</div>

  function filterGroupMembers() {
    const query = document.getElementById('member-search').value.toLowerCase().trim();
    document.querySelectorAll('.member-row').forEach(row => {
      const name = row.dataset.name || '';
      const group = row.dataset.group || '';
      const match = name.includes(query) || group.includes(query);
      row.style.display = match ? 'flex' : 'none';
    });
  }

    const name = document.getElementById('group-name-input').value.trim();
    const description = document.getElementById('group-desc-input').value.trim();

    fetch(`/groups/${currentGroupId}/update`, {

      headers: { 'Content-Type': 'application/json' },

      .then(res => res.json())
      .then(data => {

      .catch(err => console.error(err));

    groupAvatarInput.click();
  }

  groupAvatarInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) { alert('Файл слишком большой'); return; }
    if (!file.type.startsWith('image/')) { alert('Только изображения'); return; }

    const formData = new FormData();
    formData.append('avatar', file);
    formData.append('requesterId', currentUser.id);

      .then(res => res.json())
      .then(data => {
        if (data.success) {
          const big = document.querySelector('.group-avatar-big');
          if (big) big.innerHTML = `<img src="/uploads/${data.filename}?t=${Date.now()}" /><div class="overlay">Сменить</div>`;

  // ===== УДАЛЕНИЕ УЧАСТНИКА (без подтверждения) =====
  async function kickMember(userId, userName) {
    if (!currentGroupId) return;

    const ok = await customConfirm(
      `Удалить ${userName} из группы?`,
      'Удаление участника',
      { icon: '👤', danger: true, okText: 'Удалить' }
    );
    if (!ok) return;

    fetch(`/groups/${currentGroupId}/remove-member`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, requesterId: currentUser.id })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          loadGroups();
          setTimeout(() => openGroupInfo(), 300);
        } else {
          console.error('Не удалось удалить: ' + (data.error || 'неизвестная ошибка'));
        }
      })
      .catch(err => { console.error(err); });
  }

  function openAddMembers() {
    if (!currentGroupId) return;
    fetch(`/groups/${currentGroupId}/members`)
      .then(res => res.json())
      .then(members => {
        const memberIds = members.map(m => m.id);
        const available = contacts.filter(c => !memberIds.includes(c.id));
        if (available.length === 0) { alert('Все ваши студенты уже в группе'); return; }

        const studentsHtml = available.map(c => `
          <label class="member-checkbox">
            <input type="checkbox" value="${c.id}" />
            <div class="member-mini-avatar">
              ${c.avatar ? `<img src="/uploads/${c.avatar}" />` : getInitials(c.fullName)}
            </div>
            <div class="member-mini-info">
              <div class="member-mini-name">${c.fullName}</div>
              <div class="member-mini-sub">${c.group || 'Студент'}</div>
            </div>
          </label>
        `).join('');

        modalTitle.textContent = 'Добавить участников';
        modalBody.innerHTML = `
          <div class="field">
            <label>Выберите студентов</label>
            <div class="members-selector" id="members-selector" style="max-height:300px;">
              ${studentsHtml}
            </div>
          </div>
          <button class="close-btn" style="background:var(--accent);" onclick="addMembers()">Добавить</button>
        `;
      });
  }

  function addMembers() {
    const memberIds = Array.from(document.querySelectorAll('#members-selector input[type="checkbox"]:checked'))
      .map(cb => parseInt(cb.value));
    if (!memberIds.length) { closeModal(); return; }

    let done = 0;
    memberIds.forEach(uid => {
      fetch(`/groups/${currentGroupId}/add-member`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: uid, requesterId: currentUser.id })
      })
        .then(res => res.json())
        .then(() => { done++; if (done === memberIds.length) { closeModal(); loadGroups(); } })
        .catch(() => { done++; if (done === memberIds.length) { closeModal(); loadGroups(); } });
    });
  }

    modalBody.innerHTML = `
      <div class="password-form">
        <div class="field"><label>Текущий пароль</label><input type="password" id="old-password" /></div>
        <div class="field"><label>Новый пароль</label><input type="password" id="new-password" placeholder="Минимум 4 символа" /></div>
        <div class="field"><label>Повторите пароль</label><input type="password" id="confirm-password" /></div>
        <button class="save-btn" onclick="changePassword()">Сохранить</button>
        <div class="error-msg" id="password-error"></div>
        <div class="success-msg" id="password-success"></div>
        <div style="margin-top:12px; text-align:center;">

        </div>
      </div>
    `;

  function changePassword() {
    const oldPass = document.getElementById('old-password').value;
    const newPass = document.getElementById('new-password').value;
    const confirmPass = document.getElementById('confirm-password').value;
    const errorEl = document.getElementById('password-error');
    const successEl = document.getElementById('password-success');
    errorEl.textContent = ''; successEl.textContent = '';

    if (!oldPass || !newPass || !confirmPass) { errorEl.textContent = 'Заполните все поля'; return; }
    if (newPass.length < 4) { errorEl.textContent = 'Минимум 4 символа'; return; }
    if (newPass !== confirmPass) { errorEl.textContent = 'Пароли не совпадают'; return; }
    if (newPass === oldPass) { errorEl.textContent = 'Совпадает со старым'; return; }

    fetch('/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentUser.id, oldPassword: oldPass, newPassword: newPass })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          successEl.textContent = 'Пароль изменён!';
          document.getElementById('old-password').value = '';
          document.getElementById('new-password').value = '';
          document.getElementById('confirm-password').value = '';
          setTimeout(() => openProfile(), 1500);
        } else errorEl.textContent = data.error || 'Ошибка';
      })
      .catch(err => { errorEl.textContent = 'Ошибка соединения'; });
  }

        <div>
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            Тёмная тема
          </div>
          <div class="desc">Тёмное оформление</div>
        </div>
        <div class="toggle ${isDark ? 'active' : ''}" onclick="toggleTheme(this)"><div class="knob"></div></div>
      </div>
      <div class="settings-field">
        <div>
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Уведомления
          </div>
          <div class="desc">Показывать уведомления</div>
        </div>
        <div class="toggle ${localStorage.getItem('notifications') !== 'false' ? 'active' : ''}" onclick="toggleNotifications(this)"><div class="knob"></div></div>
      </div>
      <div class="settings-field">
        <div>
          <div class="label" style="color:var(--danger);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--danger);"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Выйти
          </div>
          <div class="desc">Завершить сессию</div>
        </div>
        <button class="profile-action-btn" style="flex:0; padding:8px 16px; color:var(--danger); border-color:var(--danger);" onclick="logout()">Выйти</button>
      </div>
    `;
    modalOverlay.classList.add('show');
  }

  function toggleTheme(el) {
    el.classList.toggle('active');
    const isDark = el.classList.contains('active');
    if (isDark) { document.body.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
    else { document.body.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
  }

  function toggleNotifications(el) {
    el.classList.toggle('active');
    localStorage.setItem('notifications', el.classList.contains('active'));
  }

  function closeModal(event) {
    if (event && event.target !== event.currentTarget) return;
    modalOverlay.classList.remove('show');
  }

  function scrollToBottom() { messagesArea.scrollTop = messagesArea.scrollHeight; }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('✅ SW зарегистрирован'))
        .catch((err) => console.error('❌ Ошибка SW:', err));
    });
  }

  console.log('✅ ITHub Messenger v26.0 (Группы+Реакции+Закрепы) загружен');
</script>
</body>
</html>
