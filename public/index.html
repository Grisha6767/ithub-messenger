  function loadMessages(contactId) {
    fetch(`/messages?from=${currentUser.id}&to=${contactId}`)
      .then(res => res.json())
      .then(messages => {
        messagesArea.innerHTML = '';
        if (messages.length === 0) {
          messagesArea.innerHTML = `<div class="no-messages">Нет сообщений. Напишите первым!</div>`;
        } else {
          messages.forEach(msg => {
            const sender = msg.from_user === currentUser.id ? 'my' : 'other';
            addMessage(msg, sender);
          });
        }
        scrollToBottom();
      })
      .catch(err => console.error('Ошибка загрузки сообщений:', err));
  }

  function addMessage(msg, type) {
    const noMsg = messagesArea.querySelector('.no-messages');
    if (noMsg) noMsg.remove();

    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper ${type}`;
    if (msg.id) wrapper.dataset.msgId = msg.id;
    if (msg.tempId) wrapper.dataset.tempId = msg.tempId;

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';

    if (msg.reply_to && msg.reply_text) {
      const replyQuote = document.createElement('div');
      replyQuote.className = 'reply-quote';
      const replyAuthor = msg.reply_from === currentUser.id ? 'Вы' : (contacts.find(c => c.id === msg.reply_from)?.fullName || 'Собеседник');
      replyQuote.innerHTML = `
        <span class="reply-author">${replyAuthor}</span>
        <span class="reply-text">${msg.reply_text}</span>
      `;
      replyQuote.onclick = () => {
        const target = messagesArea.querySelector(`[data-msg-id="${msg.reply_to}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('highlight');
          setTimeout(() => target.classList.remove('highlight'), 1500);
        }
      };
      bubble.appendChild(replyQuote);
    }

    if (msg.voice) {
      bubble.appendChild(createVoicePlayer(msg.voice));
    } else if (msg.file) {
      const ext = msg.file.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext)) {
        const img = document.createElement('img');
        img.src = '/uploads/' + msg.file;
        img.alt = 'Изображение';
        img.addEventListener('click', () => openImageViewer(img.src));
        bubble.appendChild(img);
      } else if (['mp3', 'wav', 'ogg', 'webm', 'm4a'].includes(ext)) {
        bubble.appendChild(createVoicePlayer(msg.file));
      } else {
        const link = document.createElement('a');
        link.href = '/uploads/' + msg.file;
        link.target = '_blank';
        link.textContent = 'Файл: ' + msg.file;
        bubble.appendChild(link);
      }
    } else {
      const textNode = document.createElement('span');
      textNode.textContent = msg.text || '';
      bubble.appendChild(textNode);
    }

    if (msg.edited) {
      const edited = document.createElement('span');
      edited.className = 'message-edited';
      edited.textContent = '(изменено)';
      bubble.appendChild(edited);
    }

    const time = document.createElement('div');
    time.className = 'message-time';
    const date = new Date(msg.timestamp);
    time.textContent = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

    if (type === 'my') {
      const status = document.createElement('span');
      status.className = 'message-status' + (msg.read ? ' read' : '');
      status.textContent = msg.read ? '✓✓' : '✓';
      time.appendChild(status);
    }

    wrapper.appendChild(bubble);
    wrapper.appendChild(time);

    // ===== ДОЛГОЕ НАЖАТИЕ И ПКМ =====
    let longPressTimer = null;
    let longPressTriggered = false;
    let touchStartX = 0;
    let touchStartY = 0;

    wrapper.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      showMessageMenu(e.clientX, e.clientY, msg, bubble, wrapper, type);
    });

    wrapper.addEventListener('touchstart', (e) => {
      longPressTriggered = false;
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;

      longPressTimer = setTimeout(() => {
        longPressTriggered = true;
        const t = e.touches[0];
        showMessageMenu(t.clientX, t.clientY, msg, bubble, wrapper, type);
        if (navigator.vibrate) navigator.vibrate(30);
      }, 450);
    }, { passive: true });

    wrapper.addEventListener('touchend', (e) => {
      if (longPressTimer) clearTimeout(longPressTimer);
      if (longPressTriggered) {
        e.preventDefault();
        e.stopPropagation();
      }
    });

    wrapper.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const dx = Math.abs(touch.clientX - touchStartX);
      const dy = Math.abs(touch.clientY - touchStartY);
      if (dx > 10 || dy > 10) {
        if (longPressTimer) clearTimeout(longPressTimer);
      }
    }, { passive: true });

    wrapper.addEventListener('touchcancel', () => {
      if (longPressTimer) clearTimeout(longPressTimer);
    });

    messagesArea.appendChild(wrapper);
    scrollToBottom();
  }

  function showMessageMenu(x, y, msg, bubble, wrapper, type) {
    const msgId = wrapper.dataset.msgId;
    if (!msgId) return;

    let text = '';
    const voiceEl = bubble.querySelector('.voice-message');
    const imgEl = bubble.querySelector('img');
    const linkEl = bubble.querySelector('a');
    if (voiceEl) text = '🎤 Голосовое';
    else if (imgEl) text = '🖼 Изображение';
    else if (linkEl) text = '📎 Файл';
    else {
      const clone = bubble.cloneNode(true);
      clone.querySelectorAll('.message-edited, .reply-quote').forEach(el => el.remove());
      text = clone.textContent.trim();
    }

    const msgObj = {
      id: parseInt(msgId),
      text: text,
      from_user: type === 'my' ? currentUser.id : (msg.from_user || null),
      isMine: type === 'my',
      voice: voiceEl ? true : null,
      file: (imgEl || linkEl) ? true : null
    };
    showContextMenu(x, y, msgObj, wrapper);
  }

  function createVoicePlayer(fileName) {
    const container = document.createElement('div');
    container.className = 'voice-message';

    const playBtn = document.createElement('button');
    playBtn.className = 'voice-play-btn';
    playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>';

    const wave = document.createElement('div');
    wave.className = 'voice-wave';
    for (let i = 0; i < 20; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = (8 + Math.random() * 16) + 'px';
      wave.appendChild(bar);
    }

    const timeLabel = document.createElement('span');
    timeLabel.className = 'voice-time';
    timeLabel.textContent = '0:00';

    const audio = document.createElement('audio');
    audio.src = '/uploads/' + fileName;
    audio.preload = 'metadata';
    audio.setAttribute('playsinline', '');
    audio.setAttribute('webkit-playsinline', '');
    audio.load();

    audio.addEventListener('loadedmetadata', () => {
      if (isFinite(audio.duration)) timeLabel.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      const current = audio.currentTime;
      timeLabel.textContent = formatTime(current);
      const totalBars = wave.children.length;
      const playedBars = Math.floor((current / audio.duration) * totalBars) || 0;
      wave.querySelectorAll('.bar').forEach((bar, i) => {
        bar.classList.toggle('played', i < playedBars);
      });
    });

    audio.addEventListener('ended', () => {
      playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
      timeLabel.textContent = formatTime(audio.duration);
      wave.querySelectorAll('.bar').forEach(bar => bar.classList.remove('played'));
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
      } else {
        audio.pause();
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
      }
    });

    container.appendChild(playBtn);
    container.appendChild(wave);
    container.appendChild(timeLabel);

    return container;
  }

  function formatTime(seconds) {
    if (!isFinite(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function showContextMenu(x, y, msg, wrapper) {
    const oldMenu = document.querySelector('.context-menu');
    if (oldMenu) oldMenu.remove();

    const menu = document.createElement('div');
    menu.className = 'context-menu show';

    // Ограничиваем позицию, чтобы меню не вылезало за экран
    const menuWidth = 180;
    const menuHeight = msg.isMine ? 150 : 60;
    const maxX = window.innerWidth - menuWidth - 10;
    const maxY = window.innerHeight - menuHeight - 10;
    const finalX = Math.min(Math.max(10, x), maxX);
    const finalY = Math.min(Math.max(10, y), maxY);

    menu.style.left = finalX + 'px';
    menu.style.top = finalY + 'px';

    const replyBtn = document.createElement('button');
    replyBtn.className = 'context-menu-item';
    replyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg> Ответить';
    replyBtn.onclick = () => { menu.remove(); startReply(msg, wrapper); };
    menu.appendChild(replyBtn);

    if (msg.isMine) {
      if (msg.text && !msg.file && !msg.voice && !msg.text.startsWith('🎤') && !msg.text.startsWith('🖼') && !msg.text.startsWith('📎')) {
        const editBtn = document.createElement('button');
        editBtn.className = 'context-menu-item';
        editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Изменить';
        editBtn.onclick = () => { menu.remove(); startEdit(msg, wrapper); };
        menu.appendChild(editBtn);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'context-menu-item danger';
      delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Удалить';
      delBtn.onclick = () => { menu.remove(); deleteMessage(msg, wrapper); };
      menu.appendChild(delBtn);
    }

    document.body.appendChild(menu);

    // Закрытие при клике вне меню
    setTimeout(() => {
      const closeMenu = (e) => {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeMenu);
          document.removeEventListener('touchstart', closeMenu);
        }
      };
      document.addEventListener('click', closeMenu);
      document.addEventListener('touchstart', closeMenu);
    }, 50);
  }

  function startReply(msg, wrapper) {
    replyingTo = msg;
    inputArea.classList.add('replying');
    replyPanel.classList.add('show');
    const author = msg.isMine ? 'Вы' : (contacts.find(c => c.id === msg.from_user)?.fullName || 'Собеседник');
    replyToName.textContent = author;
    replyToText.textContent = msg.text.length > 60 ? msg.text.substring(0, 60) + '...' : msg.text;
    messageInput.focus();
  }

  function cancelReply() {
    replyingTo = null;
    inputArea.classList.remove('replying');
    replyPanel.classList.remove('show');
    messageInput.focus();
  }

  function startEdit(msg, wrapper) {
    editingMessage = msg;
    editingWrapper = wrapper;
    editPanel.classList.add('show');
    editText.textContent = msg.text.length > 50 ? msg.text.substring(0, 50) + '...' : msg.text;
    messageInput.value = msg.text;
    messageInput.focus();
    messageInput.setSelectionRange(msg.text.length, msg.text.length);
    inputArea.classList.add('editing');
  }

  function cancelEdit() {
    editingMessage = null;
    editingWrapper = null;
    editPanel.classList.remove('show');
    messageInput.value = '';
    inputArea.classList.remove('editing');
    messageInput.focus();
  }

  function saveEdit() {
    if (!editingMessage || !editingWrapper) return;
    const newText = messageInput.value.trim();
    if (!newText || newText === editingMessage.text) { cancelEdit(); return; }

    fetch('/edit-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: editingMessage.id, text: newText, from: currentUser.id })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          const bubble = editingWrapper.querySelector('.message-bubble');
          const textNode = Array.from(bubble.childNodes).find(n => n.nodeType === 3);
          if (textNode) textNode.textContent = newText;
          if (!bubble.querySelector('.message-edited')) {
            const edited = document.createElement('span');
            edited.className = 'message-edited';
            edited.textContent = '(изменено)';
            bubble.appendChild(edited);
          }
          editingMessage.text = newText;
          cancelEdit();
        } else {
          alert('Не удалось изменить: ' + (data.error || 'неизвестная ошибка'));
        }
      })
      .catch(err => {
        console.error('Ошибка изменения:', err);
        alert('Ошибка соединения');
      });
  }

  function deleteMessage(msg, wrapper) {
    fetch('/delete-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: msg.id, from: currentUser.id })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) wrapper.remove();
        else alert('Не удалось удалить: ' + (data.error || 'неизвестная ошибка'));
      })
      .catch(err => {
        console.error('Ошибка удаления:', err);
        alert('Ошибка соединения');
      });
  }

  function toggleSearchMessages() {
    searchMessagesPanel.classList.toggle('show');
    if (searchMessagesPanel.classList.contains('show')) {
      searchMessagesInput.focus();
    } else {
      searchMessagesInput.value = '';
      searchQuery = '';
      searchMessagesCount.textContent = '';
      messagesArea.querySelectorAll('.message-wrapper').forEach(w => w.style.display = '');
    }
  }

  function searchInMessages() {
    searchQuery = searchMessagesInput.value.toLowerCase().trim();
    const items = messagesArea.querySelectorAll('.message-wrapper');
    let count = 0;
    items.forEach(w => {
      const text = w.querySelector('.message-bubble')?.textContent?.toLowerCase() || '';
      const match = !searchQuery || text.includes(searchQuery);
      w.style.display = match ? '' : 'none';
      if (match && searchQuery) count++;
    });
    searchMessagesCount.textContent = searchQuery ? `Найдено: ${count}` : '';
  }

  function sendMessage() {
    if (editingMessage) { saveEdit(); return; }
    const text = messageInput.value.trim();
    if (!text || !currentContactId || !socket) return;

    const tempId = 'temp_' + (++messageCounter) + '_' + Date.now();
    pendingMessages.add(tempId);

    const data = {
      from: currentUser.id,
      to: currentContactId,
      text: text,
      tempId: tempId,
      replyTo: replyingTo ? replyingTo.id : null
    };

    addMessage({
      text: text,
      from_user: currentUser.id,
      timestamp: new Date(),
      tempId: tempId,
      reply_to: replyingTo ? replyingTo.id : null,
      reply_text: replyingTo ? replyingTo.text : null,
      reply_from: replyingTo ? replyingTo.from_user : null
    }, 'my');

    socket.emit('message', data);

    if (isTyping) {
      socket.emit('stop-typing', { from: currentUser.id, to: currentContactId });
      isTyping = false;
    }

    messageInput.value = '';
    messageInput.focus();
    cancelReply();
  }

  function clearChat() {
    messagesArea.innerHTML = `<div class="no-messages">Выберите собеседника, чтобы начать чат</div>`;
    chatContactName.textContent = 'Выберите контакт';
    chatContactStatus.textContent = 'онлайн';
    chatContactStatus.style.color = 'var(--accent)';
    chatAvatar.innerHTML = '?';
    messageInput.disabled = true;
    sendBtn.disabled = true;
    searchMsgBtn.style.display = 'none';
    typingIndicator.classList.remove('show');
  }

  function attachFile() { fileInput.click(); }

  function uploadFile(event) {
    const files = event.target.files;
    if (!files.length || !currentContactId) return;
    for (const file of files) sendFileFromBlob(file, file.name);
    fileInput.value = '';
  }

  function sendFileFromBlob(file, name) {
    const formData = new FormData();
    formData.append('file', file, name);
    const tempId = 'temp_' + (++messageCounter) + '_' + Date.now();
    pendingMessages.add(tempId);

    fetch('/upload', { method: 'POST', body: formData })
      .then(res => res.json())
      .then(data => {
        const msgData = {
          from: currentUser.id,
          to: currentContactId,
          text: '',
          file: data.filename,
          tempId: tempId,
          replyTo: replyingTo ? replyingTo.id : null
        };
        addMessage({
          from_user: currentUser.id,
          to_user: currentContactId,
          text: '',
          file: data.filename,
          timestamp: new Date(),
          tempId: tempId,
          reply_to: replyingTo ? replyingTo.id : null,
          reply_text: replyingTo ? replyingTo.text : null,
          reply_from: replyingTo ? replyingTo.from_user : null
        }, 'my');
        socket.emit('message', msgData);
        cancelReply();
      })
      .catch(err => console.error('Ошибка загрузки файла:', err));
  }

  async function toggleRecording() {
    if (isRecording) { stopRecording(); } else { await startRecording(); }
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      let mimeType = 'audio/webm';
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        mimeType = 'audio/webm;codecs=opus';
      } else if (MediaRecorder.isTypeSupported('audio/webm')) {
        mimeType = 'audio/webm';
      } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
        mimeType = 'audio/mp4';
      } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
        mimeType = 'audio/ogg';
      } else if (MediaRecorder.isTypeSupported('audio/wav')) {
        mimeType = 'audio/wav';
      }
      
      console.log('Используем MIME-тип:', mimeType);
      
      mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
      audioChunks = [];
      mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: mimeType });
        let ext = 'webm';
        if (mimeType.includes('mp4')) ext = 'm4a';
        else if (mimeType.includes('ogg')) ext = 'ogg';
        else if (mimeType.includes('wav')) ext = 'wav';
        sendVoiceMessage(audioBlob, ext);
      };
      mediaRecorder.start();
      isRecording = true;
      voiceBtn.style.color = '#FF4757';
    } catch (err) {
      console.error('Ошибка доступа к микрофону:', err);
      alert('Разрешите доступ к микрофону.\nОшибка: ' + err.message);
    }
  }

  function stopRecording() {
    if (mediaRecorder) {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(track => track.stop());
      isRecording = false;
      voiceBtn.style.color = '';
    }
  }

  function sendVoiceMessage(blob, ext = 'webm') {
    if (!currentContactId) return;
    const formData = new FormData();
    formData.append('file', blob, `voice_${Date.now()}.${ext}`);
    const tempId = 'temp_' + (++messageCounter) + '_' + Date.now();
    pendingMessages.add(tempId);

    fetch('/upload', { method: 'POST', body: formData })
      .then(res => res.json())
      .then(data => {
        const msgData = {
          from: currentUser.id,
          to: currentContactId,
          text: '',
          voice: data.filename,
          tempId: tempId,
          replyTo: replyingTo ? replyingTo.id : null
        };
        addMessage({
          from_user: currentUser.id,
          to_user: currentContactId,
          text: '',
          voice: data.filename,
          timestamp: new Date(),
          tempId: tempId,
          reply_to: replyingTo ? replyingTo.id : null,
          reply_text: replyingTo ? '🎤 Голосовое' : null,
          reply_from: replyingTo ? replyingTo.from_user : null
        }, 'my');
        socket.emit('message', msgData);
        cancelReply();
      })
      .catch(err => console.error('Ошибка отправки голоса:', err));
  }

  function getInitials(fullName) {
    if (!fullName) return '?';
    const parts = fullName.trim().split(' ');
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  }

  function scrollToBottom() {
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('✅ Service Worker зарегистрирован'))
        .catch((err) => console.error('❌ Ошибка SW:', err));
    });
  }

  console.log('✅ ITHub Messenger v20.0 (Долгое нажатие, ГС, аватарки) загружен');
</script>
