<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ITHub Мессенджер</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F5F5FA;
      --bg-input: #F0F0F8;
      --bg-hover: #F0EBFF;
      --bg-my-message: #7C5CFC;
      --bg-other-message: #F0F0F8;
      --text-primary: #1A1A2E;
      --text-secondary: #6B6B8A;
      --accent: #7C5CFC;
      --accent-hover: #6B4CE0;
      --border: #E8E8F0;
      --shadow: rgba(124, 92, 252, 0.08);
      --scrollbar: #D0D0E0;
      --danger: #E74C3C;
      --online: #4ADE80;
      --away: #FBBF24;
      --group-color: #4ECDC4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body.dark {
      --bg-primary: #0F0F1A;
      --bg-secondary: #1A1A2E;
      --bg-input: #252540;
      --bg-hover: #2A2A4A;
      --bg-my-message: #7C5CFC;
      --bg-other-message: #252540;
      --text-primary: #E8E8F0;
      --text-secondary: #8B8BA8;
      --accent: #9B7DFF;
      --accent-hover: #8B6DEF;
      --border: #2A2A4A;
      --shadow: rgba(0, 0, 0, 0.3);
      --scrollbar: #3A3A5A;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-primary); color: var(--text-primary);
      overscroll-behavior: none; -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }
    .app-wrapper { display: flex; height: 100vh; height: 100dvh; width: 100vw; background: var(--bg-primary); overflow: hidden; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes messageIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes highlight { 0%, 100% { background: transparent; } 50% { background: rgba(124, 92, 252, 0.15); } }

    .message-wrapper { animation: messageIn 0.25s ease; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .message-wrapper.highlight { animation: highlight 1.5s ease; }
    .message-bubble { -webkit-user-select: text; user-select: text; }

    .login-container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: var(--bg-primary); padding: 20px;
      padding-top: calc(20px + var(--safe-top));
      padding-bottom: calc(20px + var(--safe-bottom));
    }
    .login-card {
      background: var(--bg-primary); padding: 48px 40px;
      border-radius: 20px; box-shadow: 0 8px 40px var(--shadow);
      max-width: 400px; width: 100%; text-align: center;
      border: 1px solid var(--border);
    }
    .login-card h1 { font-size: 32px; color: var(--text-primary); margin-bottom: 8px; }
    .login-card .subtitle { color: var(--text-secondary); margin-bottom: 30px; font-size: 16px; }
    .login-card input {
      width: 100%; padding: 14px 16px; margin: 6px 0;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--bg-input); color: var(--text-primary); font-size: 16px;
    }
    .login-card input:focus { outline: none; border-color: var(--accent); }
    .login-card button {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: var(--accent); color: #FFFFFF;
      font-size: 16px; font-weight: 600; cursor: pointer;
      margin-top: 12px; font-family: inherit;
    }
    .login-card button:active { transform: scale(0.98); }
    .login-card .forgot { color: var(--text-secondary); font-size: 14px; text-decoration: none; margin-top: 16px; display: inline-block; }
    .login-card .error-text { color: var(--accent); font-size: 14px; margin-top: 10px; min-height: 20px; }

    .messenger { display: none; width: 100%; height: 100%; flex: 1; }

    .sidebar {
      width: 340px; min-width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      height: 100%; overflow: hidden; flex-shrink: 0;
    }
    .sidebar-header {
      padding: 14px 20px 12px;
      padding-top: calc(14px + var(--safe-top));
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary); flex-shrink: 0;
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    }
    .ithub-logo { width: auto; height: 42px; display: block; }
    .sidebar-header-info {
      font-size: 12px; color: var(--text-secondary);
      line-height: 1.3; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 100%;
    }
    .ithub-logo .logo-dark { stroke: #1A1A2E; }
    .ithub-logo .logo-dark-fill { fill: #1A1A2E; stroke: none; }
    .ithub-logo .logo-dark-text { fill: #1A1A2E; stroke: none; }
    .ithub-logo .logo-gray { fill: #B0B0B0; stroke: none; }
    body.dark .ithub-logo .logo-dark { stroke: #FFFFFF; }
    body.dark .ithub-logo .logo-dark-fill { fill: #FFFFFF; }
    body.dark .ithub-logo .logo-dark-text { fill: #FFFFFF; }
    body.dark .ithub-logo .logo-gray { fill: #FFFFFF; }

    .create-group-btn {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin: 8px 16px; padding: 12px;
      border: 1.5px dashed var(--accent);
      border-radius: 10px;
      background: var(--bg-primary); color: var(--accent);
      font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .create-group-btn:hover { background: var(--bg-hover); }
    .create-group-btn:active { transform: scale(0.98); }
    .create-group-btn svg { width: 18px; height: 18px; }

    .group-filter {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 10px 16px 4px;
      background: var(--bg-secondary); flex-shrink: 0;
    }
    .group-btn {
      padding: 6px 14px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: var(--bg-primary); color: var(--text-secondary);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .group-btn.active { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }

    .search-box { padding: 12px 16px 10px; background: var(--bg-secondary); flex-shrink: 0; }
    .search-box input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--bg-primary); color: var(--text-primary); font-size: 16px;
    }
    .search-box input:focus { outline: none; border-color: var(--accent); }

    .contacts-list { flex: 1; overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
    .contacts-list::-webkit-scrollbar { width: 4px; }
    .contacts-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    .section-label {
      padding: 10px 20px 6px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-secondary);
    }
    .sidebar-footer {
      display: flex; gap: 8px;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg-secondary); flex-shrink: 0;
    }
    .sidebar-footer-btn {
      flex: 1; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--bg-primary); color: var(--accent);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .sidebar-footer-btn:active { transform: scale(0.98); }
    .sidebar-footer-btn svg { width: 16px; height: 16px; }

    .contact-item {
      display: flex; align-items: center; padding: 12px 20px;
      cursor: pointer; border-left: 3px solid transparent;
      position: relative;
    }
    .contact-item:active { background: var(--bg-hover); }
    .contact-item.active { background: var(--bg-hover); border-left-color: var(--accent); }

    .avatar {
      width: 46px; height: 46px; border-radius: 50%;
      flex-shrink: 0; margin-right: 14px; position: relative;
    }
    .avatar.group-avatar { border-radius: 14px; background: var(--group-color); }
    .avatar-inner {
      width: 100%; height: 100%; border-radius: inherit;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #FFFFFF;
      font-weight: 600; font-size: 18px;
    }
    .avatar.group-avatar .avatar-inner { background: var(--group-color); }
    .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
    .avatar .online-dot {
      position: absolute; bottom: -1px; right: -1px;
      width: 14px; height: 14px; border-radius: 50%;
      border: 3px solid var(--bg-secondary);
      box-shadow: 0 0 0 1px var(--border); z-index: 2;
    }
    .avatar .online-dot.online { background: var(--online); }
    .avatar .online-dot.away { background: var(--away); }

    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 15px; color: var(--text-primary); font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .contact-sub { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-badge {
      background: var(--accent); color: #FFFFFF;
      border-radius: 50%; padding: 2px 8px;
      font-size: 11px; font-weight: 600;
    }
    .group-label-badge {
      display: inline-block; font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 4px;
      background: var(--group-color); color: #FFFFFF;
    }

    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      background: var(--bg-primary);
      height: 100%; min-width: 0;
    }
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px;
      padding-top: calc(16px + var(--safe-top));
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
      flex-shrink: 0; min-height: 76px;
    }
    .chat-header-left { display: flex; align-items: center; min-width: 0; flex: 1; }
    .chat-header .avatar { width: 44px; height: 44px; font-size: 17px; margin-right: 14px; cursor: pointer; }
    .chat-header .chat-contact-name { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .chat-header .chat-contact-status { font-size: 14px; color: var(--accent); }
    .chat-header-left .clickable-name { cursor: pointer; min-width: 0; overflow: hidden; }
    .chat-header-left .clickable-name > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .header-action-btn {
      background: none; border: none;
      cursor: pointer; padding: 8px; border-radius: 50%;
      color: var(--accent);
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-action-btn svg { width: 20px; height: 20px; }

    /* НОВОЕ: закреплённое сообщение */
    .pinned-bar {
      display: none; align-items: center; gap: 10px;
      padding: 10px 24px;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border);
      font-size: 13px; cursor: pointer;
      flex-shrink: 0;
    }
    .pinned-bar.show { display: flex; }
    .pinned-bar svg { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }
    .pinned-bar .pinned-text {
      flex: 1; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pinned-bar .pinned-author { font-weight: 600; color: var(--accent); margin-right: 6px; }
    .pinned-bar .unpin-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-secondary); font-size: 18px; padding: 0 6px;
      flex-shrink: 0;
    }

    .topics-bar {
      display: none; align-items: center; gap: 6px;
      padding: 8px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .topics-bar.show { display: flex; }
    .topics-bar::-webkit-scrollbar { height: 0; }

    .topic-tab {
      padding: 6px 14px;
      border: 1.5px solid var(--border); border-radius: 18px;
      background: var(--bg-primary); color: var(--text-secondary);
      font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0; transition: all 0.2s;
    }
    .topic-tab.active { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
    .topic-tab:active { transform: scale(0.97); }
    .topic-tab .topic-count { font-size: 10px; opacity: 0.7; }

    .topic-add-btn {
      padding: 6px 12px;
      border: 1.5px dashed var(--accent); border-radius: 18px;
      background: var(--bg-primary); color: var(--accent);
      font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      flex-shrink: 0;
      display: flex; align-items: center; gap: 4px;
    }
    .topic-add-btn:active { transform: scale(0.97); }
    .topic-add-btn svg { width: 14px; height: 14px; }

    .messages-area {
      flex: 1; padding: 20px 32px;
      overflow-y: auto;
      display: flex; flex-direction: column;
      background: var(--bg-primary);
      -webkit-overflow-scrolling: touch;
    }
    .messages-area::-webkit-scrollbar { width: 5px; }
    .messages-area::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    .message-wrapper { display: flex; flex-direction: column; margin-bottom: 10px; max-width: 75%; position: relative; }
    .message-wrapper.my { align-self: flex-end; align-items: flex-end; }
    .message-wrapper.other { align-self: flex-start; align-items: flex-start; }

    .message-author {
      font-size: 12px; font-weight: 600;
      color: var(--accent); margin-bottom: 2px; padding-left: 6px;
    }

    .reply-quote {
      padding: 6px 10px;
      border-left: 3px solid var(--accent);
      border-radius: 6px; margin-bottom: 6px;
      font-size: 13px;
      background: rgba(124, 92, 252, 0.1);
      cursor: pointer;
      transition: background 0.15s;
    }
    .reply-quote:hover { background: rgba(124, 92, 252, 0.2); }
    .reply-quote .reply-author {
      font-weight: 600; color: var(--accent);
      display: block; font-size: 12px;
    }
    .reply-quote .reply-text {
      color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: block;
    }
    .message-wrapper.my .reply-quote { background: rgba(255, 255, 255, 0.2); }
    .message-wrapper.my .reply-quote .reply-author { color: #FFFFFF; }
    .message-wrapper.my .reply-quote .reply-text { color: rgba(255, 255, 255, 0.8); }

    .message-bubble {
      padding: 10px 18px; border-radius: 18px;
      word-break: break-word; font-size: 15px; line-height: 1.5;
      position: relative;
    }
    .message-wrapper.my .message-bubble {
      background: var(--bg-my-message); color: #FFFFFF;
      border-bottom-right-radius: 4px;
    }
    .message-wrapper.other .message-bubble {
      background: var(--bg-other-message); color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .message-status { font-size: 11px; color: var(--text-secondary); margin-left: 6px; }
    .message-status.read { color: var(--accent); }
    .message-edited { font-size: 11px; opacity: 0.7; margin-left: 6px; font-style: italic; }
    .message-time {
      font-size: 11px; color: var(--text-secondary);
      margin-top: 4px; padding: 0 6px;
      display: flex; align-items: center; gap: 4px;
    }
    .no-messages { color: var(--text-secondary); text-align: center; padding: 60px 0; font-size: 16px; }
    .message-bubble img { max-width: 240px; border-radius: 10px; display: block; cursor: pointer; }
    .message-bubble a { color: inherit; text-decoration: none; }
    .message-wrapper.my .message-bubble a { color: #FFFFFF; }

    /* НОВОЕ: реакции под сообщением */
    .reactions-container {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 4px; padding: 0 6px;
    }
    .reaction-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .reaction-chip:hover { background: var(--bg-hover); border-color: var(--accent); }
    .reaction-chip.mine {
      background: rgba(124, 92, 252, 0.15);
      border-color: var(--accent);
    }
    .reaction-chip .emoji { font-size: 14px; }
    .reaction-chip .count { font-size: 11px; color: var(--text-secondary); font-weight: 600; }
    .message-wrapper.my .reaction-chip { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.3); }
    .message-wrapper.my .reaction-chip.mine { background: rgba(255, 255, 255, 0.4); border-color: #FFFFFF; }
    .message-wrapper.my .reaction-chip .count { color: rgba(255, 255, 255, 0.9); }

    /* Панель быстрых реакций */
    .reactions-picker {
      position: absolute;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      display: none;
      gap: 6px;
      z-index: 5001;
    }
    .reactions-picker.show { display: flex; }
    .reactions-picker .emoji-btn {
      background: none; border: none;
      font-size: 22px; cursor: pointer;
      padding: 4px 6px; border-radius: 50%;
      transition: transform 0.15s, background 0.15s;
      line-height: 1;
    }
    .reactions-picker .emoji-btn:hover { transform: scale(1.2); background: var(--bg-hover); }

    .voice-message { display: flex; align-items: center; gap: 10px; min-width: 180px; padding: 2px 0; }
    .voice-play-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.25); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: inherit;
    }
    .message-wrapper.other .voice-play-btn { background: rgba(124, 92, 252, 0.15); }
    .voice-play-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .voice-wave { flex: 1; height: 24px; display: flex; align-items: center; gap: 2px; min-width: 60px; }
    .voice-wave .bar { width: 3px; background: currentColor; opacity: 0.4; border-radius: 2px; }
    .voice-wave .bar.played { opacity: 0.9; }
    .voice-time { font-size: 12px; opacity: 0.85; flex-shrink: 0; min-width: 32px; text-align: right; }

    .context-menu {
      position: fixed; background: var(--bg-primary);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      padding: 4px 0; min-width: 180px;
      z-index: 5000; display: none;
    }
    .context-menu.show { display: block; }
    .context-menu-item {
      padding: 12px 18px; font-size: 15px;
      color: var(--text-primary);
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
    }
    .context-menu-item:active { background: var(--bg-hover); }
    .context-menu-item:hover { background: var(--bg-hover); }
    .context-menu-item.danger { color: var(--danger); }
    .context-menu-item.danger:hover { background: rgba(231, 76, 60, 0.1); }
    .context-menu-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .edit-panel {
      display: none; align-items: center; gap: 12px;
      padding: 10px 28px; background: var(--bg-hover);
      border-top: 1px solid var(--border);
      font-size: 14px; color: var(--text-primary);
    }
    .edit-panel.show { display: flex; }
    .edit-panel .edit-icon { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; }
    .edit-panel .edit-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .edit-panel .cancel-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-secondary); font-size: 22px; padding: 0 8px;
    }

    .reply-panel {
      display: none; align-items: center; gap: 12px;
      padding: 10px 28px; background: var(--bg-hover);
      border-top: 1px solid var(--border);
      font-size: 14px; color: var(--text-primary);
    }
    .reply-panel.show { display: flex; }
    .reply-panel .reply-bar {
      width: 3px; height: 32px;
      background: var(--accent);
      border-radius: 2px; flex-shrink: 0;
    }
    .reply-panel .reply-info { flex: 1; min-width: 0; }
    .reply-panel .reply-to-name {
      font-size: 13px; font-weight: 600; color: var(--accent);
    }
    .reply-panel .reply-to-text {
      font-size: 13px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reply-panel .cancel-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-secondary); font-size: 22px; padding: 0 8px;
    }

<script src="/socket.io/socket.io.js"></script>
<script>
  // ===== СОСТОЯНИЕ =====
  let currentUser = null;
  let contacts = [];
  let groups = [];
  let currentContactId = null;
  let currentGroupId = null;
  let currentGroupData = null;
  let currentTopicId = null;
  let currentGroupTopics = [];
  let socket = null;
  let unreadCounts = {};
  let isRecording = false;
  let mediaRecorder = null;
  let audioChunks = [];
  let pendingMessages = new Set();
  let messageCounter = 0;
  let selectedGroup = 'all';
  let editingMessage = null;
  let editingWrapper = null;
  let isGroupMessage = false;
  let replyingTo = null;
  let onlineUsers = [];
  let typingTimer = null;
  let isTyping = false;
  let searchQuery = '';
  let currentImageUrl = '';
  let currentMessages = [];
  let pinnedMessageId = null;

  const REACTION_EMOJIS = ['👍', '❤️', '😂', '🔥', '😮', '😢'];

  // ===== DOM =====
  const loginContainer = document.getElementById('login-container');
  const messenger = document.getElementById('messenger');
  const sidebar = document.getElementById('sidebar');
  const chatArea = document.getElementById('chat-area');
  const contactsList = document.getElementById('contacts-list');
  const messagesArea = document.getElementById('messages-area');
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const chatContactName = document.getElementById('chat-contact-name');
  const chatContactStatus = document.getElementById('chat-contact-status');
  const chatAvatar = document.getElementById('chat-avatar');
  const sidebarUserInfo = document.getElementById('sidebar-user-info');
  const searchInput = document.getElementById('search-input');
  const fileInput = document.getElementById('file-input');
  const voiceBtn = document.getElementById('voice-btn');
  const loginError = document.getElementById('login-error');
  const editPanel = document.getElementById('edit-panel');
  const editText = document.getElementById('edit-text');
  const replyPanel = document.getElementById('reply-panel');
  const replyToName = document.getElementById('reply-to-name');
  const replyToText = document.getElementById('reply-to-text');
  const inputArea = document.getElementById('input-area');
  const avatarInput = document.getElementById('avatar-input');
  const groupAvatarInput = document.getElementById('group-avatar-input');
  const typingIndicator = document.getElementById('typing-indicator');
  const typingName = document.getElementById('typing-name');
  const searchMessagesPanel = document.getElementById('search-messages-panel');
  const searchMessagesInput = document.getElementById('search-messages-input');
  const searchMessagesCount = document.getElementById('search-messages-count');
  const searchMsgBtn = document.getElementById('search-msg-btn');
  const groupInfoBtn = document.getElementById('group-info-btn');
  const topicActionsBtn = document.getElementById('topic-actions-btn');
  const topicsBar = document.getElementById('topics-bar');
  const createGroupBtn = document.getElementById('create-group-btn');
  const pinnedBar = document.getElementById('pinned-bar');
  const pinnedAuthor = document.getElementById('pinned-author');
  const pinnedText = document.getElementById('pinned-text');
  const unpinBtn = document.getElementById('unpin-btn');
  const imageViewer = document.getElementById('image-viewer');
  const imageViewerImg = document.getElementById('image-viewer-img');
  const modalOverlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-title');
  const modalBody = document.getElementById('modal-body');
  const reactionsPicker = document.getElementById('reactions-picker');
    // ===== TOAST-УВЕДОМЛЕНИЯ =====
  const toastContainer = document.getElementById('toast-container');

  function showToast(text, type = 'info', duration = 3000) {
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    const icons = { info: 'ℹ️', success: '✅', error: '❌' };
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
      <span class="toast-text">${text}</span>
    `;
    toastContainer.appendChild(toast);
    setTimeout(() => {
      toast.style.animation = 'toastOut 0.25s ease';
      setTimeout(() => toast.remove(), 250);
    }, duration);
  }

  // Заменяем стандартный alert
  window.alert = function(msg) {
    showToast(msg, 'info', 3000);
  };

  // ===== КРАСИВОЕ ПОДТВЕРЖДЕНИЕ =====
  const confirmModal = document.getElementById('confirm-modal');
  const confirmIcon = document.getElementById('confirm-icon');
  const confirmTitle = document.getElementById('confirm-title');
  const confirmText = document.getElementById('confirm-text');
  const confirmOk = document.getElementById('confirm-ok');
  const confirmCancel = document.getElementById('confirm-cancel');

  function customConfirm(text, title = 'Подтвердите действие', options = {}) {
    return new Promise((resolve) => {
      confirmIcon.textContent = options.icon || '⚠️';
      confirmTitle.textContent = title;
      confirmText.textContent = text;

      confirmOk.className = 'confirm-btn ' + (options.danger ? 'danger' : 'ok');
      confirmOk.textContent = options.okText || 'ОК';
      confirmCancel.textContent = options.cancelText || 'Отмена';

      confirmModal.classList.add('show');

      const cleanup = () => {
        confirmModal.classList.remove('show');
        confirmOk.onclick = null;
        confirmCancel.onclick = null;
      };

      confirmOk.onclick = () => { cleanup(); resolve(true); };
      confirmCancel.onclick = () => { cleanup(); resolve(false); };
    });
  }

  // Заменяем стандартный confirm на наш (асинхронный)
  window.confirm = function(msg) {
    // Старый confirm оставим как fallback — но теперь мы везде используем customConfirm
    return customConfirm(msg, 'Подтвердите действие', { danger: true });
  };

  // ===== ТЕМА =====
  function applyTheme() {
    const theme = localStorage.getItem('theme') || 'light';
    if (theme === 'dark') document.body.classList.add('dark');
    else document.body.classList.remove('dark');
  }
  applyTheme();

  // ===== МОБИЛЬНАЯ НАВИГАЦИЯ =====
  function isMobile() { return window.innerWidth <= 768; }
  function openChatMobile() {
    if (!isMobile()) return;
    sidebar.classList.add('hidden');
    chatArea.classList.add('visible');
  }
  function backToContacts() {
    sidebar.classList.remove('hidden');
    chatArea.classList.remove('visible');
  }
  window.addEventListener('resize', () => {
    if (!isMobile()) {
      sidebar.classList.remove('hidden');
      chatArea.classList.remove('visible');
    }
  });

  // ===== УВЕДОМЛЕНИЯ =====
  function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }
  function showNotification(fromName, text) {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    if (document.hasFocus()) return;
    if (localStorage.getItem('notifications') === 'false') return;
    try {
      const n = new Notification('ITHub — ' + fromName, { body: text, icon: '/icon-192.png', tag: 'ithub-msg' });
      setTimeout(() => n.close(), 5000);
    } catch (e) {}
  }

  // ===== ИЗОБРАЖЕНИЯ =====
  function openImageViewer(src) {
    currentImageUrl = src;
    imageViewerImg.src = src;
    imageViewer.classList.add('show');
  }
  function closeImageViewer(e) {
    if (e && e.target !== e.currentTarget && e.target.className !== 'close-viewer') return;
    imageViewer.classList.remove('show');
    imageViewerImg.src = '';
  }

  // ===== АВАТАРКИ =====
  function getInitials(fullName) {
    if (!fullName) return '?';
    const parts = fullName.trim().split(' ');
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
  }

  function renderAvatar(el, user, size) {
    el.innerHTML = '';
    el.classList.remove('group-avatar');
    const inner = document.createElement('div');
    inner.className = 'avatar-inner';
    if (user.avatar) {
      const img = document.createElement('img');
      img.src = '/uploads/' + user.avatar + '?t=' + Date.now();
      inner.appendChild(img);
    } else {
      inner.textContent = getInitials(user.fullName);
    }
    el.appendChild(inner);

    if (size === 'small' && user.role) {
      const online = onlineUsers.find(u => u.id === user.id);
      if (online && (online.status === 'online' || online.status === 'away')) {
        const dot = document.createElement('span');
        dot.className = 'online-dot ' + online.status;
        el.appendChild(dot);
      }
    }
  }

  function renderGroupAvatar(el, group) {
    el.innerHTML = '';
    el.classList.add('group-avatar');
    const inner = document.createElement('div');
    inner.className = 'avatar-inner';
    if (group.avatar) {
      const img = document.createElement('img');
      img.src = '/uploads/' + group.avatar + '?t=' + Date.now();
      inner.appendChild(img);
    } else {
      inner.textContent = getInitials(group.name);
    }
    el.appendChild(inner);
  }

  function renderChatAvatar() {
    if (currentGroupId) {
      const group = groups.find(g => g.id === currentGroupId);
      if (!group) return;
      renderGroupAvatar(chatAvatar, group);
      return;
    }
    if (!currentContactId) return;
    const contact = contacts.find(c => c.id === currentContactId);
    if (!contact) return;
    chatAvatar.innerHTML = '';
    chatAvatar.classList.remove('group-avatar');
    const inner = document.createElement('div');
    inner.className = 'avatar-inner';
    if (contact.avatar) {
      const img = document.createElement('img');
      img.src = '/uploads/' + contact.avatar + '?t=' + Date.now();
      inner.appendChild(img);
    } else {
      inner.textContent = getInitials(contact.fullName);
    }
    chatAvatar.appendChild(inner);
  }

  // ===== СТАТУСЫ =====
  function getStatusText(userId) {
    const online = onlineUsers.find(u => u.id === userId);
    if (online) {
      if (online.status === 'online') return { text: 'в сети', color: 'var(--online)' };
      if (online.status === 'away') return { text: 'отошёл', color: 'var(--away)' };
    }
    const contact = contacts.find(c => c.id === userId);
    if (contact && contact.lastSeen) {
      return { text: 'был(а) ' + formatLastSeen(contact.lastSeen), color: 'var(--text-secondary)' };
    }
    return { text: 'не в сети', color: 'var(--text-secondary)' };
  }
  function formatLastSeen(iso) {
    const d = new Date(iso); const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'только что';
    if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ч назад';
    return d.toLocaleDateString('ru-RU');
  }
  function updateChatHeaderStatus() {
    if (currentGroupId) {
      const group = groups.find(g => g.id === currentGroupId);
      if (group) {
        chatContactName.textContent = group.name;
        const onlineCount = getOnlineGroupMembersCount();
        chatContactStatus.textContent = `${group.member_count} участников${onlineCount > 0 ? ` · ${onlineCount} онлайн` : ''}`;
        chatContactStatus.style.color = 'var(--group-color)';
      }
      return;
    }
    if (!currentContactId) return;
    const contact = contacts.find(c => c.id === currentContactId);
    if (!contact) return;
    const sub = contact.role === 'teacher' ? 'Преподаватель' : 'Студент';
    const st = getStatusText(contact.id);
    chatContactStatus.textContent = `${sub} · ${st.text}`;
    chatContactStatus.style.color = st.color;
  }

  let groupMembersCache = [];
  function getOnlineGroupMembersCount() {
    if (!groupMembersCache.length) return 0;
    return groupMembersCache.filter(m => onlineUsers.some(u => u.id === m.id && u.status === 'online')).length;
  }

  // ===== ВХОД =====
  function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!email || !password) { loginError.textContent = 'Введите email и пароль'; return; }

    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: email, password })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          currentUser = data.user;
          loginError.textContent = '';
          loginContainer.style.display = 'none';
          messenger.style.display = 'flex';
          messenger.style.flex = '1';

          sidebarUserInfo.textContent = `${currentUser.fullName} (${currentUser.role === 'teacher' ? 'Преподаватель' : 'Студент'})`;
          if (currentUser.role === 'teacher') createGroupBtn.style.display = 'flex';

          requestNotificationPermission();
          socket = io();
          socket.emit('join', currentUser.id);

          loadContacts();
          loadGroups();

          // ЛИЧНЫЕ
          socket.on('message', (msg) => {
            if (msg.from_user === currentUser.id) {
              if (msg.tempId) {
                const wrapper = messagesArea.querySelector(`[data-temp-id="${msg.tempId}"]`);
                if (wrapper) { wrapper.dataset.msgId = msg.id; wrapper.removeAttribute('data-temp-id'); }
              }
              return;
            }
            if (msg.from_user === currentContactId && !currentGroupId) {
              addMessage(msg, 'other', false);
              socket.emit('mark-read', { from: msg.from_user, to: currentUser.id });
            } else {
              if (!unreadCounts[msg.from_user]) unreadCounts[msg.from_user] = 0;
              unreadCounts[msg.from_user]++;
              renderContacts();
              updateTitle();
              const sender = contacts.find(c => c.id === msg.from_user);
              if (sender) showNotification(sender.fullName, msg.text || 'Вложение');
            }
          });

          socket.on('message-edited', (data) => {
            const wrapper = messagesArea.querySelector(`[data-msg-id="${data.id}"]`);
            if (!wrapper) return;
            const bubble = wrapper.querySelector('.message-bubble');
            updateBubbleText(bubble, data.text);
          });
          socket.on('message-deleted', (data) => {
            const wrapper = messagesArea.querySelector(`[data-msg-id="${data.id}"]`);
            if (wrapper) wrapper.remove();
            currentMessages = currentMessages.filter(m => m.id !== data.id);
          });
          socket.on('messages-read', (data) => {
            if (data.by === currentContactId) {
              messagesArea.querySelectorAll('.message-wrapper.my').forEach(w => {
                const st = w.querySelector('.message-status');
                if (st) { st.textContent = '✓✓'; st.classList.add('read'); }
              });
            }
          });

          // ГРУППОВЫЕ
          socket.on('group-message', (msg) => {
            if (msg.from_user === currentUser.id) {
              if (msg.tempId) {
                const wrapper = messagesArea.querySelector(`[data-temp-id="${msg.tempId}"]`);
                if (wrapper) { wrapper.dataset.msgId = msg.id; wrapper.removeAttribute('data-temp-id'); }
              }
              currentMessages.push(msg);
              return;
            }
            if (msg.group_id === currentGroupId) {
              if ((msg.topic_id || null) === (currentTopicId || null)) {
                addMessage(msg, 'other', true);
              } else {
                const topicId = msg.topic_id || 'main';
                if (!unreadCounts['topic_' + topicId]) unreadCounts['topic_' + topicId] = 0;
                unreadCounts['topic_' + topicId]++;
                renderTopics();
              }
            } else {
              if (!unreadCounts['group_' + msg.group_id]) unreadCounts['group_' + msg.group_id] = 0;
              unreadCounts['group_' + msg.group_id]++;
              renderContacts();
              updateTitle();
              const group = groups.find(g => g.id === msg.group_id);
              if (group) showNotification(group.name, msg.text || 'Вложение');
            }
          });

          socket.on('group-message-edited', (data) => {
            const wrapper = messagesArea.querySelector(`[data-msg-id="${data.id}"]`);
            if (!wrapper) return;
            const bubble = wrapper.querySelector('.message-bubble');
            updateBubbleText(bubble, data.text);
          });
          socket.on('group-message-deleted', (data) => {
            const wrapper = messagesArea.querySelector(`[data-msg-id="${data.id}"]`);
            if (wrapper) wrapper.remove();
            currentMessages = currentMessages.filter(m => m.id !== data.id);
          });

          // Групповые события
          socket.on('group-created', () => loadGroups());
          socket.on('group-added', () => loadGroups());
          socket.on('group-updated', () => {
            loadGroups().then(() => {
              if (currentGroupId) {
                const g = groups.find(x => x.id === currentGroupId);
                if (g) { currentGroupData = g; renderChatAvatar(); updateChatHeaderStatus(); }
              }
            });
          });
          socket.on('group-deleted', (data) => {
            loadGroups();
            if (currentGroupId === data.groupId) {
              currentGroupId = null;
              currentTopicId = null;
              clearChat();
            }
          });
          socket.on('group-removed', (data) => {
            loadGroups();
            if (currentGroupId === data.groupId) {
              currentGroupId = null;
              currentTopicId = null;
              clearChat();
            }
          });
          socket.on('topic-created', (data) => { if (data.groupId === currentGroupId) loadTopics(currentGroupId); });
          socket.on('topic-updated', (data) => { if (data.groupId === currentGroupId) loadTopics(currentGroupId); });
          socket.on('topic-deleted', (data) => {
            if (data.groupId === currentGroupId) {
              if (currentTopicId === data.topicId) currentTopicId = null;
              loadTopics(currentGroupId);
            }
          });

          // Закрепы
          socket.on('group-pinned', (data) => {
            if (data.groupId === currentGroupId) {
              pinnedMessageId = data.messageId;
              renderPinnedBar();
            }
          });
          socket.on('group-unpinned', (data) => {
            if (data.groupId === currentGroupId) {
              pinnedMessageId = null;
              renderPinnedBar();
            }
          });

          // Реакции
          socket.on('reaction-toggled', (data) => {
            updateReactionInUI(data);
          });

          // Онлайн
          socket.on('online-users', (users) => {
            onlineUsers = users;
            renderContacts();
            if (currentContactId && !currentGroupId) updateChatHeaderStatus();
            if (currentGroupId) updateChatHeaderStatus();
            // Обновляем онлайн-индикаторы в списке участников группы
            document.querySelectorAll('.member-mini-avatar .mini-online-dot').forEach(dot => {
              const userId = parseInt(dot.dataset.userId);
              const online = users.find(u => u.id === userId);
              dot.className = 'mini-online-dot' + (online && (online.status === 'online' || online.status === 'away') ? ' ' + online.status : '');
            });
          });

          socket.on('user-typing', (data) => {
            if (data.from === currentContactId && !currentGroupId) {
              const contact = contacts.find(c => c.id === data.from);
              typingName.textContent = contact ? contact.fullName : 'Собеседник';
              typingIndicator.classList.add('show');
            }
          });
          socket.on('user-stop-typing', (data) => {
            if (data.from === currentContactId) typingIndicator.classList.remove('show');
          });

          socket.on('avatar-updated', (data) => {
            const contact = contacts.find(c => c.id === data.userId);
            if (contact) { contact.avatar = data.avatar; renderContacts(); }
            if (currentContactId === data.userId && !currentGroupId) renderChatAvatar();
          });

          window.addEventListener('focus', () => { if (socket) socket.emit('back', currentUser.id); });
          window.addEventListener('blur', () => { if (socket) socket.emit('away', currentUser.id); });

          messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              if (editingMessage) saveEdit();
              else sendMessage();
            }
            if (e.key === 'Escape') {
              if (editingMessage) cancelEdit();
              else if (replyingTo) cancelReply();
            }
          });

          messageInput.addEventListener('input', handleTyping);
          document.addEventListener('paste', handlePaste);

          // Клик по документу — закрытие пикера реакций
          document.addEventListener('click', (e) => {
            if (!e.target.closest('#reactions-picker') && !e.target.closest('.reaction-chip')) {
              reactionsPicker.classList.remove('show');
            }
          });

        } else {
          loginError.textContent = 'Неверный логин или пароль';
        }
      })
      .catch(err => { console.error(err); loginError.textContent = 'Ошибка соединения'; });
  }

  function handlePaste(e) {
    if ((!currentContactId && !currentGroupId) || editingMessage) return;
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (!file) continue;
        sendFileFromBlob(file, 'screenshot_' + Date.now() + '.png');
        return;
      }
    }
  }

  function handleTyping() {
    if (!socket || !currentContactId || currentGroupId) return;
    if (!isTyping) { isTyping = true; socket.emit('typing', { from: currentUser.id, to: currentContactId }); }
    if (typingTimer) clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      isTyping = false;
      socket.emit('stop-typing', { from: currentUser.id, to: currentContactId });
    }, 2000);
  }

  function updateTitle() {
    const total = Object.values(unreadCounts).reduce((a, b) => a + b, 0);
    document.title = total > 0 ? `ITHub (${total})` : 'ITHub Мессенджер';
  }

  // ===== ВЫХОД =====
  function logout() {
    modalOverlay.classList.remove('show');
    editPanel.classList.remove('show');
    replyPanel.classList.remove('show');
    searchMessagesPanel.classList.remove('show');
    topicsBar.classList.remove('show');
    pinnedBar.classList.remove('show');
    imageViewer.classList.remove('show');
    reactionsPicker.classList.remove('show');

    if (socket) { try { socket.disconnect(); } catch(e) {} socket = null; }

    currentUser = null;
    currentContactId = null;
    currentGroupId = null;
    currentGroupData = null;
    currentTopicId = null;
    contacts = [];
    groups = [];
    onlineUsers = [];
    unreadCounts = {};
    editingMessage = null;
    editingWrapper = null;
    replyingTo = null;
    currentMessages = [];
    pinnedMessageId = null;
    groupMembersCache = [];

    messagesArea.innerHTML = `<div class="no-messages">Выберите собеседника, чтобы начать чат</div>`;
    contactsList.innerHTML = '';
    chatContactName.textContent = 'Выберите контакт';
    chatContactStatus.textContent = 'онлайн';
    chatAvatar.innerHTML = '?';
    chatAvatar.classList.remove('group-avatar');
    sidebarUserInfo.textContent = 'Загрузка...';
    document.getElementById('group-filter').style.display = 'none';
    document.getElementById('group-filter').innerHTML = '';
    createGroupBtn.style.display = 'none';

    messenger.style.display = 'none';
    loginContainer.style.display = 'flex';
    document.title = 'ITHub Мессенджер';

    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    loginError.textContent = '';

    sidebar.classList.remove('hidden');
    chatArea.classList.remove('visible');
  }

  function updateBubbleText(bubble, newText) {
    const replyQuote = bubble.querySelector('.reply-quote');
    const savedReply = replyQuote ? replyQuote.cloneNode(true) : null;
    bubble.innerHTML = '';
    if (savedReply) bubble.appendChild(savedReply);
    bubble.appendChild(document.createTextNode(newText));
    const edited = document.createElement('span');
    edited.className = 'message-edited';
    edited.textContent = '(изменено)';
    bubble.appendChild(edited);
  }

  // ===== ЗАГРУЗКА =====
  function loadContacts() {
    return fetch(`/contacts?userId=${currentUser.id}`)
      .then(res => res.json())
      .then(data => { contacts = data; renderGroupFilter(); renderContacts(); })
      .catch(err => console.error('Ошибка контактов:', err));
  }

  function loadGroups() {
    return fetch(`/groups?userId=${currentUser.id}`)
      .then(res => res.json())
      .then(data => {
        groups = data;
        renderContacts();
        if (currentGroupId) {
          const g = groups.find(x => x.id === currentGroupId);
          if (g) { currentGroupData = g; updateChatHeaderStatus(); }
        }
      })
      .catch(err => console.error('Ошибка групп:', err));
  }

  // ===== ОТРИСОВКА =====
  function renderContacts() {
    contactsList.innerHTML = '';

    if (groups.length > 0) {
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'Группы';
      contactsList.appendChild(label);

      groups.forEach(group => {
        const div = document.createElement('div');
        div.className = 'contact-item';
        if (currentGroupId === group.id) div.classList.add('active');
        div.dataset.name = group.name;
        div.dataset.type = 'group';

        const avatarEl = document.createElement('div');
        avatarEl.className = 'avatar';
        renderGroupAvatar(avatarEl, group);

        const infoEl = document.createElement('div');
        infoEl.className = 'contact-info';
        infoEl.innerHTML = `
          <div class="contact-name">${group.name} <span class="group-label-badge">Группа</span></div>
          <div class="contact-sub">${group.member_count} участников</div>
        `;

        div.appendChild(avatarEl);
        div.appendChild(infoEl);

        const unread = unreadCounts['group_' + group.id] || 0;
        if (unread > 0) {
          const badge = document.createElement('div');
          badge.className = 'contact-badge';
          badge.textContent = unread;
          div.appendChild(badge);
        }

        div.addEventListener('click', () => {
          if (unreadCounts['group_' + group.id]) {
            delete unreadCounts['group_' + group.id];
            updateTitle();
            renderContacts();
          }
          openGroupChat(group.id);
        });

        contactsList.appendChild(div);
      });
    }

    const label2 = document.createElement('div');
    label2.className = 'section-label';
    label2.textContent = 'Контакты';
    contactsList.appendChild(label2);

    let filteredContacts = contacts;
    if (currentUser.role === 'teacher' && selectedGroup !== 'all') {
      filteredContacts = contacts.filter(c => c.group === selectedGroup);
    }

    filteredContacts.forEach(contact => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      if (currentContactId === contact.id && !currentGroupId) div.classList.add('active');

      const subLabel = contact.role === 'teacher'
        ? (contact.groups ? contact.groups.join(', ') : 'Преподаватель')
        : (contact.group || 'Студент');

      const unread = unreadCounts[contact.id] || 0;

      div.dataset.name = contact.fullName;
      div.dataset.sub = subLabel;
      div.dataset.group = contact.group || '';
      div.dataset.type = 'user';

      const avatarEl = document.createElement('div');
      avatarEl.className = 'avatar';
      renderAvatar(avatarEl, contact, 'small');

      const infoEl = document.createElement('div');
      infoEl.className = 'contact-info';
      infoEl.innerHTML = `
        <div class="contact-name">${contact.fullName}</div>
        <div class="contact-sub">${subLabel}</div>
      `;

      div.appendChild(avatarEl);
      div.appendChild(infoEl);

      if (unread > 0) {
        const badge = document.createElement('div');
        badge.className = 'contact-badge';
        badge.textContent = unread;
        div.appendChild(badge);
      }

      div.addEventListener('click', () => {
        if (unreadCounts[contact.id]) { delete unreadCounts[contact.id]; updateTitle(); renderContacts(); }
        openChat(contact.id);
      });

      contactsList.appendChild(div);
    });

    filterContacts();
  }

  function filterContacts() {
    const query = searchInput.value.toLowerCase().trim();
    const items = contactsList.querySelectorAll('.contact-item');
    items.forEach(item => {
      const name = item.dataset.name?.toLowerCase() || '';
      const sub = item.dataset.sub?.toLowerCase() || '';
      const itemGroup = item.dataset.group || '';
      const type = item.dataset.type;
      let groupMatch = true;
      if (type === 'user' && currentUser.role === 'teacher' && selectedGroup !== 'all') {
        groupMatch = itemGroup === selectedGroup;
      }
      const textMatch = name.includes(query) || sub.includes(query);
      item.style.display = (groupMatch && textMatch) ? 'flex' : 'none';
    });
  }

  function renderGroupFilter() {
    const container = document.getElementById('group-filter');
    if (currentUser.role !== 'teacher') { container.style.display = 'none'; return; }
    container.style.display = 'flex';
    container.innerHTML = '';
    const groupsSet = new Set();
    contacts.forEach(c => { if (c.role === 'student' && c.group) groupsSet.add(c.group); });
    const grps = Array.from(groupsSet).sort();

    const allBtn = document.createElement('button');
    allBtn.className = 'group-btn' + (selectedGroup === 'all' ? ' active' : '');
    allBtn.textContent = 'Все';
    allBtn.onclick = () => selectGroup('all');
    container.appendChild(allBtn);

    grps.forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'group-btn' + (selectedGroup === g ? ' active' : '');
      btn.textContent = g;
      btn.onclick = () => selectGroup(g);
      container.appendChild(btn);
    });
  }

  function selectGroup(group) {
    selectedGroup = group;
    renderGroupFilter();
    renderContacts();
  }

  // ===== ОТКРЫТИЕ ЛИЧНОГО =====
  function openChat(contactId) {
    currentGroupId = null;
    currentGroupData = null;
    currentTopicId = null;
    currentContactId = contactId;
    currentMessages = [];
    pinnedMessageId = null;
    groupMembersCache = [];
    const contact = contacts.find(c => c.id === contactId);
    if (!contact) return;

    topicsBar.classList.remove('show');
    groupInfoBtn.style.display = 'none';
    topicActionsBtn.style.display = 'none';
    pinnedBar.classList.remove('show');
    cancelReply();

    chatContactName.textContent = contact.fullName;
    renderChatAvatar();
    updateChatHeaderStatus();
    searchMsgBtn.style.display = 'flex';

    messageInput.disabled = false;
    sendBtn.disabled = false;

    document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
    const items = contactsList.querySelectorAll('.contact-item');
    const idx = Array.from(items).findIndex(el => el.dataset.name === contact.fullName && el.dataset.type === 'user');
    if (idx !== -1 && items[idx]) items[idx].classList.add('active');

    searchMessagesPanel.classList.remove('show');
    searchMessagesInput.value = '';

    loadMessages(contactId);
    socket.emit('mark-read', { from: contactId, to: currentUser.id });
    openChatMobile();
    setTimeout(() => messageInput.focus(), 350);
  }

  // ===== ОТКРЫТИЕ ГРУППЫ =====
  function openGroupChat(groupId) {
    currentContactId = null;
    currentGroupId = groupId;
    currentTopicId = null;
    currentMessages = [];
    pinnedMessageId = null;
    cancelReply();

    const group = groups.find(g => g.id === groupId);
    if (!group) return;
    currentGroupData = group;

    chatContactName.textContent = group.name;
    renderChatAvatar();
    updateChatHeaderStatus();
    searchMsgBtn.style.display = 'flex';
    groupInfoBtn.style.display = 'flex';

    if (socket) socket.emit('group-join', groupId);

    messageInput.disabled = false;
    sendBtn.disabled = false;

    document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
    const items = contactsList.querySelectorAll('.contact-item');
    const idx = Array.from(items).findIndex(el => el.dataset.name === group.name && el.dataset.type === 'group');
    if (idx !== -1 && items[idx]) items[idx].classList.add('active');

    searchMessagesPanel.classList.remove('show');
    searchMessagesInput.value = '';

    // Загружаем участников для онлайн-счётчика
    fetch(`/groups/${groupId}/members`)
      .then(res => res.json())
      .then(members => { groupMembersCache = members; updateChatHeaderStatus(); })
      .catch(() => {});

    // Обновляем данные группы
    fetch(`/groups?userId=${currentUser.id}`)
      .then(res => res.json())
      .then(allGroups => {
        groups = allGroups;
        const g = groups.find(x => x.id === groupId);
        if (g) {
          currentGroupData = g;
          pinnedMessageId = g.pinned_message_id;
          renderPinnedBar();
          updateChatHeaderStatus();
        }
      });

    loadTopics(groupId).then(() => {
      if (currentGroupTopics.length > 0) {
        const mainTopic = currentGroupTopics.find(t => t.name === 'Общий чат') || currentGroupTopics[0];
        currentTopicId = mainTopic.id;
        renderTopics();
        loadGroupMessages(groupId, currentTopicId);
      }
    });

    openChatMobile();
    setTimeout(() => messageInput.focus(), 350);
  }

  function loadTopics(groupId) {
    return fetch(`/groups/${groupId}/topics`)
      .then(res => res.json())
      .then(data => { currentGroupTopics = data; renderTopics(); return data; })
      .catch(err => { console.error(err); currentGroupTopics = []; return []; });
  }

  function renderTopics() {
    if (!currentGroupId) { topicsBar.classList.remove('show'); return; }
    topicsBar.innerHTML = '';
    topicsBar.classList.add('show');

    const group = groups.find(g => g.id === currentGroupId);
    const isCreator = group && group.creator_id === currentUser.id;

    currentGroupTopics.forEach(topic => {
      const btn = document.createElement('button');
      btn.className = 'topic-tab' + (currentTopicId === topic.id ? ' active' : '');
      const unread = unreadCounts['topic_' + (topic.id || 'main')] || 0;
      btn.innerHTML = `# ${topic.name}${unread > 0 ? ` <span class="topic-count">${unread}</span>` : ''}`;
      btn.onclick = () => selectTopic(topic.id);
      topicsBar.appendChild(btn);
    });

    if (isCreator) {
      const addBtn = document.createElement('button');
      addBtn.className = 'topic-add-btn';
      addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Ветка';
      addBtn.onclick = () => openCreateTopic();
      topicsBar.appendChild(addBtn);
    }

    // Кнопка действий с текущей веткой (только для создателя)
    if (isCreator && currentTopicId) {
      topicActionsBtn.style.display = 'flex';
    } else {
      topicActionsBtn.style.display = 'none';
    }
  }

  function selectTopic(topicId) {
    currentTopicId = topicId;
    if (unreadCounts['topic_' + (topicId || 'main')]) {
      delete unreadCounts['topic_' + (topicId || 'main')];
      updateTitle();
    }
    renderTopics();
    loadGroupMessages(currentGroupId, topicId);
  }

  function loadGroupMessages(groupId, topicId) {
    let url = `/groups/${groupId}/messages`;
    if (topicId) url += `?topicId=${topicId}`;
    fetch(url)
      .then(res => res.json())
      .then(messages => {
        currentMessages = messages;
        messagesArea.innerHTML = '';
        if (messages.length === 0) {
          messagesArea.innerHTML = `<div class="no-messages">Нет сообщений. Напишите первым!</div>`;
        } else {
          messages.forEach(msg => {
            const sender = msg.from_user === currentUser.id ? 'my' : 'other';
            addMessage(msg, sender, true);
          });
        }
        scrollToBottom();
        renderPinnedBar();
      })
      .catch(err => console.error(err));
  }

  function loadMessages(contactId) {
    fetch(`/messages?from=${currentUser.id}&to=${contactId}`)
      .then(res => res.json())
      .then(messages => {
        currentMessages = messages;
        messagesArea.innerHTML = '';
        if (messages.length === 0) {
          messagesArea.innerHTML = `<div class="no-messages">Нет сообщений. Напишите первым!</div>`;
        } else {
          messages.forEach(msg => {
            const sender = msg.from_user === currentUser.id ? 'my' : 'other';
            addMessage(msg, sender, false);
          });
        }
        scrollToBottom();
      })
      .catch(err => console.error(err));
  }

  // ===== ЗАКРЕП =====
  function renderPinnedBar() {
    if (!currentGroupId || !pinnedMessageId) {
      pinnedBar.classList.remove('show');
      return;
    }
    const msg = currentMessages.find(m => m.id === pinnedMessageId);
    if (!msg) {
      pinnedBar.classList.remove('show');
      return;
    }
    pinnedBar.classList.add('show');
    const author = contacts.find(c => c.id === msg.from_user);
    pinnedAuthor.textContent = (author ? author.fullName : 'Участник') + ':';
    pinnedText.textContent = msg.text || 'Вложение';

    const group = groups.find(g => g.id === currentGroupId);
    const isCreator = group && group.creator_id === currentUser.id;
    unpinBtn.style.display = isCreator ? 'block' : 'none';
  }

  function scrollToPinned() {
    if (!pinnedMessageId) return;
    const target = messagesArea.querySelector(`[data-msg-id="${pinnedMessageId}"]`);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      target.classList.add('highlight');
      setTimeout(() => target.classList.remove('highlight'), 1500);
    }
  }

  function unpinMessage() {
    if (!currentGroupId || !pinnedMessageId) return;
    fetch(`/groups/${currentGroupId}/unpin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requesterId: currentUser.id })
    }).then(() => { pinnedMessageId = null; renderPinnedBar(); })
      .catch(err => console.error(err));
  }

  // ===== ДОБАВЛЕНИЕ СООБЩЕНИЯ =====
  function addMessage(msg, type, isGroup) {
    const noMsg = messagesArea.querySelector('.no-messages');
    if (noMsg) noMsg.remove();

    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper ${type}`;
    if (msg.id) wrapper.dataset.msgId = msg.id;
    if (msg.tempId) wrapper.dataset.tempId = msg.tempId;

    if (isGroup && type === 'other') {
      const author = document.createElement('div');
      author.className = 'message-author';
      const user = contacts.find(c => c.id === msg.from_user);
      author.textContent = user ? user.fullName : 'Участник';
      wrapper.appendChild(author);
    }

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';

    if (msg.reply_to && msg.reply_text) {
      const replyQuote = document.createElement('div');
      replyQuote.className = 'reply-quote';
      const replyAuthor = msg.reply_from === currentUser.id ? 'Вы' : (contacts.find(c => c.id === msg.reply_from)?.fullName || 'Участник');
      replyQuote.innerHTML = `
        <span class="reply-author">${replyAuthor}</span>
        <span class="reply-text">${msg.reply_text}</span>
      `;
      replyQuote.onclick = () => {
        const target = messagesArea.querySelector(`[data-msg-id="${msg.reply_to}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('highlight');
          setTimeout(() => target.classList.remove('highlight'), 1500);
        }
      };
      bubble.appendChild(replyQuote);
    }

    if (msg.voice) {
      bubble.appendChild(createVoicePlayer(msg.voice));
    } else if (msg.file) {
      const ext = msg.file.split('.').pop().toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext)) {
        const img = document.createElement('img');
        img.src = '/uploads/' + msg.file;
        img.alt = 'Изображение';
        img.addEventListener('click', () => openImageViewer(img.src));
        bubble.appendChild(img);
      } else if (['mp3', 'wav', 'ogg', 'webm', 'm4a'].includes(ext)) {
        bubble.appendChild(createVoicePlayer(msg.file));
      } else {
        const link = document.createElement('a');
        link.href = '/uploads/' + msg.file;
        link.target = '_blank';
        link.textContent = 'Файл: ' + msg.file;
        bubble.appendChild(link);
      }
    } else {
      const textNode = document.createElement('span');
      textNode.textContent = msg.text || '';
      bubble.appendChild(textNode);
    }

    if (msg.edited) {
      const edited = document.createElement('span');
      edited.className = 'message-edited';
      edited.textContent = '(изменено)';
      bubble.appendChild(edited);
    }

    const time = document.createElement('div');
    time.className = 'message-time';
    const date = new Date(msg.timestamp);
    time.textContent = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

    if (type === 'my' && !isGroup) {
      const status = document.createElement('span');
      status.className = 'message-status' + (msg.read ? ' read' : '');
      status.textContent = msg.read ? '✓✓' : '✓';
      time.appendChild(status);
    }

    wrapper.appendChild(bubble);

    // Реакции
    const reactionsEl = document.createElement('div');
    reactionsEl.className = 'reactions-container';
    reactionsEl.dataset.msgId = msg.id || '';
    renderReactionsInto(reactionsEl, msg.reactions || [], msg.id || 0, isGroup);
    wrapper.appendChild(reactionsEl);

    wrapper.appendChild(time);

    // События
    let longPressTimer = null;
    let longPressTriggered = false;
    let touchStartX = 0;
    let touchStartY = 0;

    wrapper.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const msgWithFlag = { ...msg, isMine: type === 'my' };
      showMessageMenu(e.clientX, e.clientY, msgWithFlag, bubble, wrapper, type, isGroup);
    });

    wrapper.addEventListener('touchstart', (e) => {
      longPressTriggered = false;
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      longPressTimer = setTimeout(() => {
        longPressTriggered = true;
        const t = e.touches[0];
        const msgWithFlag = { ...msg, isMine: type === 'my' };
        showMessageMenu(t.clientX, t.clientY, msgWithFlag, bubble, wrapper, type, isGroup);
        if (navigator.vibrate) navigator.vibrate(30);
      }, 450);
    }, { passive: true });

    wrapper.addEventListener('touchend', (e) => {
      if (longPressTimer) clearTimeout(longPressTimer);
      if (longPressTriggered) { e.preventDefault(); e.stopPropagation(); }
    });

    wrapper.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const dx = Math.abs(touch.clientX - touchStartX);
      const dy = Math.abs(touch.clientY - touchStartY);
      if (dx > 10 || dy > 10) { if (longPressTimer) clearTimeout(longPressTimer); }
    }, { passive: true });

    wrapper.addEventListener('touchcancel', () => { if (longPressTimer) clearTimeout(longPressTimer); });

    messagesArea.appendChild(wrapper);
    scrollToBottom();
  }

  // ===== РЕНДЕР РЕАКЦИЙ =====
  function renderReactionsInto(el, reactions, messageId, isGroup) {
    el.innerHTML = '';
    if (!reactions || reactions.length === 0) return;

    const grouped = {};
    reactions.forEach(r => {
      if (!grouped[r.emoji]) grouped[r.emoji] = { count: 0, mine: false };
      grouped[r.emoji].count++;
      if (r.user_id === currentUser.id) grouped[r.emoji].mine = true;
    });

    Object.keys(grouped).forEach(emoji => {
      const chip = document.createElement('div');
      chip.className = 'reaction-chip' + (grouped[emoji].mine ? ' mine' : '');
      chip.innerHTML = `<span class="emoji">${emoji}</span><span class="count">${grouped[emoji].count}</span>`;
      chip.onclick = (e) => { e.stopPropagation(); toggleReaction(messageId, emoji, isGroup); };
      el.appendChild(chip);
    });
  }

  function updateReactionInUI(data) {
    const { messageId, userId, emoji, isGroup, removed } = data;
    const isGrp = isGroup === 1 || isGroup === true;

    // Обновляем данные в currentMessages
    const msg = currentMessages.find(m => m.id === messageId);
    if (msg) {
      if (!msg.reactions) msg.reactions = [];
      if (removed) {
        msg.reactions = msg.reactions.filter(r => !(r.emoji === emoji && r.user_id === userId));
      } else {
        const exists = msg.reactions.some(r => r.emoji === emoji && r.user_id === userId);
        if (!exists) msg.reactions.push({ emoji, user_id: userId });
      }
    }

    // Обновляем UI
    const container = messagesArea.querySelector(`.reactions-container[data-msg-id="${messageId}"]`);
    if (container && msg) {
      renderReactionsInto(container, msg.reactions || [], messageId, isGrp);
    }
  }

  function toggleReaction(messageId, emoji, isGroup) {
    fetch('/reactions/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messageId, userId: currentUser.id, emoji, isGroup: isGroup ? 1 : 0
      })
    }).catch(err => console.error(err));
  }

  // ===== ПИКЕР РЕАКЦИЙ =====
  function showReactionsPicker(x, y, messageId, isGroup) {
    reactionsPicker.innerHTML = '';
    REACTION_EMOJIS.forEach(emoji => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.textContent = emoji;
      btn.onclick = (e) => {
        e.stopPropagation();
        toggleReaction(messageId, emoji, isGroup);
        reactionsPicker.classList.remove('show');
      };
      reactionsPicker.appendChild(btn);
    });

    reactionsPicker.classList.add('show');
    const rect = reactionsPicker.getBoundingClientRect();
    let left = x - rect.width / 2;
    let top = y - rect.height - 10;
    if (left < 10) left = 10;
    if (left + rect.width > window.innerWidth - 10) left = window.innerWidth - rect.width - 10;
    if (top < 10) top = y + 20;
    reactionsPicker.style.left = left + 'px';
    reactionsPicker.style.top = top + 'px';
  }

  // ===== МЕНЮ =====
  function showMessageMenu(x, y, msg, bubble, wrapper, type, isGroup) {
    const msgId = wrapper.dataset.msgId;
    if (!msgId) return;

    const oldMenu = document.querySelector('.context-menu');
    if (oldMenu) oldMenu.remove();

    const menu = document.createElement('div');
    menu.className = 'context-menu show';

    const menuWidth = 200;
    const menuHeight = 260;
    const maxX = window.innerWidth - menuWidth - 10;
    const maxY = window.innerHeight - menuHeight - 10;
    menu.style.left = Math.min(Math.max(10, x), maxX) + 'px';
    menu.style.top = Math.min(Math.max(10, y), maxY) + 'px';

    const isMyMsg = type === 'my';
    const isText = msg.text && !msg.file && !msg.voice;
    const isTeacher = currentUser.role === 'teacher';
    const isGroupCreator = currentGroupId && groups.find(g => g.id === currentGroupId)?.creator_id === currentUser.id;

    // ===== РЕАКЦИИ (всегда) =====
    const reactBtn = document.createElement('button');
    reactBtn.className = 'context-menu-item';
    reactBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg> Реакция';
    reactBtn.onclick = (e) => {
      e.stopPropagation();
      menu.remove();
      const rect = wrapper.getBoundingClientRect();
      showReactionsPicker(rect.left + rect.width / 2, rect.top, parseInt(msgId), isGroup);
    };
    menu.appendChild(reactBtn);

    // ===== ОТВЕТИТЬ =====
    const replyBtn = document.createElement('button');
    replyBtn.className = 'context-menu-item';
    replyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg> Ответить';
    replyBtn.onclick = () => { menu.remove(); startReply({ ...msg, isMine: isMyMsg }, wrapper); };
    menu.appendChild(replyBtn);

    // ===== ИЗМЕНИТЬ (только свои текстовые) =====
    if (isMyMsg && isText) {
      const editBtn = document.createElement('button');
      editBtn.className = 'context-menu-item';
      editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Изменить';
      editBtn.onclick = () => { menu.remove(); startEdit(msg, wrapper, isGroup); };
      menu.appendChild(editBtn);
    }

    // ===== ЗАКРЕПИТЬ (только создатель группы) =====
    if (isGroup && isGroupCreator) {
      const pinBtn = document.createElement('button');
      pinBtn.className = 'context-menu-item';
      pinBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg> Закрепить';
      pinBtn.onclick = () => {
        menu.remove();
        fetch(`/groups/${currentGroupId}/pin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messageId: parseInt(msgId), requesterId: currentUser.id })
        }).catch(err => console.error(err));
      };
      menu.appendChild(pinBtn);
    }

    // ===== УДАЛИТЬ =====
    const canDelete = isMyMsg || (isGroup && (isTeacher || isGroupCreator));
    if (canDelete) {
      const delBtn = document.createElement('button');
      delBtn.className = 'context-menu-item danger';
      delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Удалить';
      delBtn.onclick = () => { menu.remove(); deleteMessage(msg, wrapper, isGroup); };
      menu.appendChild(delBtn);
    }

    document.body.appendChild(menu);

    setTimeout(() => {
      const closeMenu = (e) => {
        if (!menu.contains(e.target)) {
          menu.remove();
          document.removeEventListener('click', closeMenu);
          document.removeEventListener('touchstart', closeMenu);
        }
      };
      document.addEventListener('click', closeMenu);
      document.addEventListener('touchstart', closeMenu);
    }, 50);
  }

  // ===== ОТВЕТ =====
  function startReply(msg, wrapper) {
    replyingTo = msg;
    inputArea.classList.add('replying');
    replyPanel.classList.add('show');
    const author = msg.isMine ? 'Вы' : (contacts.find(c => c.id === msg.from_user)?.fullName || 'Участник');
    replyToName.textContent = author;
    replyToText.textContent = (msg.text || 'Вложение').length > 60 ? (msg.text || 'Вложение').substring(0, 60) + '...' : (msg.text || 'Вложение');
    messageInput.focus();
  }

  function cancelReply() {
    replyingTo = null;
    inputArea.classList.remove('replying');
    replyPanel.classList.remove('show');
  }

  // ===== РЕДАКТИРОВАНИЕ =====
  function startEdit(msg, wrapper, isGroup) {
    editingMessage = msg;
    editingWrapper = wrapper;
    isGroupMessage = isGroup;
    editPanel.classList.add('show');
    editText.textContent = msg.text.length > 50 ? msg.text.substring(0, 50) + '...' : msg.text;
    messageInput.value = msg.text;
    messageInput.focus();
    messageInput.setSelectionRange(msg.text.length, msg.text.length);
    inputArea.classList.add('editing');
  }

  function cancelEdit() {
    editingMessage = null;
    editingWrapper = null;
    editPanel.classList.remove('show');
    messageInput.value = '';
    inputArea.classList.remove('editing');
    messageInput.focus();
  }

  function saveEdit() {
    if (!editingMessage || !editingWrapper) return;
    const newText = messageInput.value.trim();
    if (!newText || newText === editingMessage.text) { cancelEdit(); return; }

    const msgId = editingMessage.id;
    const wrapper = editingWrapper;
    const isGroup = isGroupMessage;

    const bubble = wrapper.querySelector('.message-bubble');
    updateBubbleText(bubble, newText);
    editingMessage.text = newText;
    cancelEdit();

    if (isGroup) {
      fetch(`/groups/${currentGroupId}/messages/edit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messageId: msgId, text: newText, from: currentUser.id })
      }).catch(err => console.error(err));
    } else {
      fetch('/edit-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: msgId, text: newText, from: currentUser.id })
      }).catch(err => console.error(err));
    }
  }

  function deleteMessage(msg, wrapper, isGroup) {
    wrapper.remove();
    currentMessages = currentMessages.filter(m => m.id !== msg.id);

    if (isGroup) {
      fetch(`/groups/${currentGroupId}/messages/delete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messageId: msg.id, from: currentUser.id })
      }).catch(err => console.error(err));
    } else {
      fetch('/delete-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: msg.id, from: currentUser.id })
      }).catch(err => console.error(err));
    }
  }

  // ===== ОТПРАВКА =====
  function sendMessage() {
    if (editingMessage) { saveEdit(); return; }
    const text = messageInput.value.trim();
    if (!text) return;

    const replyToId = replyingTo ? replyingTo.id : null;
    const replyText = replyingTo ? (replyingTo.text || 'Вложение') : null;
    const replyFrom = replyingTo ? replyingTo.from_user : null;

    if (currentGroupId) {
      const tempId = 'temp_' + (++messageCounter) + '_' + Date.now();
      pendingMessages.add(tempId);
      const msgData = {
        text, from_user: currentUser.id, timestamp: new Date(), tempId,
        reply_to: replyToId, reply_text: replyText, reply_from: replyFrom, reactions: []
      };
      currentMessages.push(msgData);
      addMessage(msgData, 'my', true);
      socket.emit('group-message', {
        groupId: currentGroupId, topicId: currentTopicId,
        from: currentUser.id, text, tempId, replyTo: replyToId
      });
    } else if (currentContactId) {
      const tempId = 'temp_' + (++messageCounter) + '_' + Date.now();
      pendingMessages.add(tempId);
      const msgData = {
        text, from_user: currentUser.id, timestamp: new Date(), tempId,
        reply_to: replyToId, reply_text: replyText, reply_from: replyFrom, reactions: []
      };
      currentMessages.push(msgData);
      addMessage(msgData, 'my', false);
      socket.emit('message', {
        from: currentUser.id, to: currentContactId, text, tempId, replyTo: replyToId
      });
    }

    messageInput.value = '';
    messageInput.focus();
    cancelReply();
  }

  // ===== ФАЙЛЫ =====
  function attachFile() { fileInput.click(); }

  function uploadFile(event) {
    const files = event.target.files;
    if (!files.length) return;
    if (!currentContactId && !currentGroupId) return;
    for (const file of files) sendFileFromBlob(file, file.name);
