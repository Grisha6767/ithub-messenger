<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ITHub Мессенджер</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F5F5FA;
      --bg-input: #F0F0F8;
      --bg-hover: #F0EBFF;
      --bg-my-message: #7C5CFC;
      --bg-other-message: #F0F0F8;
      --text-primary: #1A1A2E;
      --text-secondary: #6B6B8A;
      --accent: #7C5CFC;
      --accent-hover: #6B4CE0;
      --border: #E8E8F0;
      --shadow: rgba(124, 92, 252, 0.08);
      --scrollbar: #D0D0E0;
      --danger: #E74C3C;
      --online: #4ADE80;
      --away: #FBBF24;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    body.dark {
      --bg-primary: #0F0F1A;
      --bg-secondary: #1A1A2E;
      --bg-input: #252540;
      --bg-hover: #2A2A4A;
      --bg-my-message: #7C5CFC;
      --bg-other-message: #252540;
      --text-primary: #E8E8F0;
      --text-secondary: #8B8BA8;
      --accent: #9B7DFF;
      --accent-hover: #8B6DEF;
      --border: #2A2A4A;
      --shadow: rgba(0, 0, 0, 0.3);
      --scrollbar: #3A3A5A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background 0.3s, color 0.3s;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    .app-wrapper {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      background: var(--bg-primary);
      overflow: hidden;
      transition: background 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message-wrapper {
      animation: messageIn 0.25s ease;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .message-bubble {
      -webkit-user-select: text;
      user-select: text;
    }

    .login-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg-primary);
      padding: 20px;
      padding-top: calc(20px + var(--safe-top));
      padding-bottom: calc(20px + var(--safe-bottom));
      animation: fadeIn 0.4s ease;
    }

    .login-card {
      background: var(--bg-primary);
      padding: 48px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 40px var(--shadow);
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--border);
      animation: popIn 0.3s ease;
    }

    .login-card h1 { font-size: 32px; color: var(--text-primary); margin-bottom: 8px; }
    .login-card .subtitle { color: var(--text-secondary); margin-bottom: 30px; font-size: 16px; }

    .login-card input {
      width: 100%;
      padding: 14px 16px;
      margin: 6px 0;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      transition: border 0.2s, background 0.3s;
    }

    .login-card input:focus { outline: none; border-color: var(--accent); }

    .login-card button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }

    .login-card button:hover { background: var(--accent-hover); }
    .login-card button:active { transform: scale(0.98); }
    .login-card .forgot { color: var(--text-secondary); font-size: 14px; text-decoration: none; margin-top: 16px; display: inline-block; }
    .login-card .error-text { color: var(--accent); font-size: 14px; margin-top: 10px; min-height: 20px; }

    .messenger { display: none; width: 100%; height: 100%; flex: 1; animation: fadeIn 0.3s ease; }

    .sidebar {
      width: 340px;
      min-width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .sidebar-header {
      padding: 14px 20px 12px;
      padding-top: calc(14px + var(--safe-top));
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .ithub-logo {
      width: auto;
      height: 42px;
      display: block;
    }

    .sidebar-header-info {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .ithub-logo .logo-dark { stroke: #1A1A2E; }
    .ithub-logo .logo-dark-fill { fill: #1A1A2E; stroke: none; }
    .ithub-logo .logo-dark-text { fill: #1A1A2E; stroke: none; }
    .ithub-logo .logo-gray { fill: #B0B0B0; stroke: none; }

    body.dark .ithub-logo .logo-dark { stroke: #FFFFFF; }
    body.dark .ithub-logo .logo-dark-fill { fill: #FFFFFF; }
    body.dark .ithub-logo .logo-dark-text { fill: #FFFFFF; }
    body.dark .ithub-logo .logo-gray { fill: #FFFFFF; }

    .mobile-menu-btn,
    .mobile-back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .mobile-menu-btn:active,
    .mobile-back-btn:active {
      background: var(--bg-hover);
    }

    .mobile-menu-btn svg,
    .mobile-back-btn svg {
      width: 22px;
      height: 22px;
    }

    .group-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 16px 4px;
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .group-btn {
      padding: 6px 14px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--bg-primary);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      white-space: nowrap;
    }

    .group-btn:hover { border-color: var(--accent); color: var(--accent); }
    .group-btn.active { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }

    .search-box { padding: 12px 16px 10px; background: var(--bg-secondary); flex-shrink: 0; }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 16px;
      transition: border 0.2s, background 0.3s;
    }

    .search-box input:focus { outline: none; border-color: var(--accent); }

    .contacts-list { flex: 1; overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
    .contacts-list::-webkit-scrollbar { width: 4px; }
    .contacts-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    .sidebar-footer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .sidebar-footer-btn {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg-primary);
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .sidebar-footer-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
    }

    .sidebar-footer-btn:active {
      transform: scale(0.98);
    }

    .sidebar-footer-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      border-left: 3px solid transparent;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .contact-item:hover { background: var(--bg-hover); }
    .contact-item:active { transform: scale(0.99); background: var(--bg-hover); }
    .contact-item.active { background: var(--bg-hover); border-left-color: var(--accent); }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-right: 14px;
      position: relative;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 18px;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar .online-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 3px solid var(--bg-secondary);
      box-shadow: 0 0 0 1px var(--border);
      z-index: 2;
      transition: background 0.3s;
    }

    .avatar .online-dot.online { background: var(--online); }
    .avatar .online-dot.away { background: var(--away); }

    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 15px; color: var(--text-primary); font-weight: 500; }
    .contact-sub { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .contact-badge {
      background: var(--accent);
      color: #FFFFFF;
      border-radius: 50%;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      height: 100%;
      min-width: 0;
      transition: background 0.3s;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      padding-top: calc(16px + var(--safe-top));
      border-bottom: 1px solid var(--border);
      background: var(--bg-primary);
      flex-shrink: 0;
      min-height: 76px;
    }

    .chat-header-left { display: flex; align-items: center; min-width: 0; flex: 1; }
    .chat-header .avatar {
      width: 44px;
      height: 44px;
      font-size: 17px;
      margin-right: 14px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .chat-header .avatar:hover { transform: scale(1.08); }

    .chat-header .chat-contact-name { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .chat-header .chat-contact-status { font-size: 14px; color: var(--accent); transition: color 0.2s; }

    .chat-header-left .clickable-name {
      cursor: pointer;
      transition: opacity 0.15s;
      min-width: 0;
      overflow: hidden;
    }

    .chat-header-left .clickable-name > div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-left .clickable-name:hover { opacity: 0.75; }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .header-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
      color: var(--accent);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-action-btn:hover { background: var(--bg-hover); }
    .header-action-btn svg { width: 20px; height: 20px; }

    .messages-area {
      flex: 1;
      padding: 20px 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      transition: background 0.3s;
      -webkit-overflow-scrolling: touch;
    }

    .messages-area::-webkit-scrollbar { width: 5px; }
    .messages-area::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
      max-width: 75%;
    }

    .message-wrapper.my { align-self: flex-end; align-items: flex-end; }
    .message-wrapper.other { align-self: flex-start; align-items: flex-start; }

    .message-bubble {
      padding: 10px 18px;
      border-radius: 18px;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.5;
      position: relative;
    }

    .message-wrapper.my .message-bubble {
      background: var(--bg-my-message);
      color: #FFFFFF;
      border-bottom-right-radius: 4px;
    }

    .message-wrapper.other .message-bubble {
      background: var(--bg-other-message);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .reply-quote {
      padding: 6px 10px;
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      background: rgba(124, 92, 252, 0.1);
      cursor: pointer;
      transition: background 0.15s;
    }

    .reply-quote:hover { background: rgba(124, 92, 252, 0.2); }
    .reply-quote .reply-author { font-weight: 600; color: var(--accent); display: block; font-size: 12px; }
    .reply-quote .reply-text { color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

    .message-wrapper.my .reply-quote { background: rgba(255, 255, 255, 0.2); }
    .message-wrapper.my .reply-quote .reply-author { color: #FFFFFF; }
    .message-wrapper.my .reply-quote .reply-text { color: rgba(255, 255, 255, 0.8); }

    .message-status {
      font-size: 11px;
      color: var(--text-secondary);
      margin-left: 6px;
    }

    .message-status.read { color: var(--accent); }

    .voice-message {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 180px;
      padding: 2px 0;
    }

    .voice-play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: inherit;
      transition: background 0.2s;
    }

    .message-wrapper.other .voice-play-btn { background: rgba(124, 92, 252, 0.15); }
    .voice-play-btn:hover { background: rgba(255, 255, 255, 0.4); }
    .message-wrapper.other .voice-play-btn:hover { background: rgba(124, 92, 252, 0.25); }
    .voice-play-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .voice-wave {
      flex: 1;
      height: 24px;
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 60px;
    }

    .voice-wave .bar {
      width: 3px;
      background: currentColor;
      opacity: 0.4;
      border-radius: 2px;
      transition: opacity 0.15s;
    }

    .voice-wave .bar.played { opacity: 0.9; }

    .voice-time {
      font-size: 12px;
      opacity: 0.85;
      flex-shrink: 0;
      min-width: 32px;
      text-align: right;
    }

    .context-menu {
      position: fixed;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      padding: 4px 0;
      min-width: 160px;
      z-index: 5000;
      display: none;
      animation: popIn 0.15s ease;
    }

    .context-menu.show { display: block; }

    .context-menu-item {
      padding: 12px 18px;
      font-size: 15px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .context-menu-item:hover { background: var(--bg-hover); }
    .context-menu-item.danger { color: var(--danger); }
    .context-menu-item.danger:hover { background: rgba(231, 76, 60, 0.1); }
    .context-menu-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .message-edited {
      font-size: 11px;
      opacity: 0.7;
      margin-left: 6px;
      font-style: italic;
    }

    .message-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .no-messages {
      color: var(--text-secondary);
      text-align: center;
      padding: 60px 0;
      font-size: 16px;
    }

    .message-bubble img {
      max-width: 240px;
      border-radius: 10px;
      display: block;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }

    .message-bubble img:hover {
      transform: scale(1.02);
      filter: brightness(1.05);
    }

    .message-bubble a { color: inherit; text-decoration: none; }
    .message-wrapper.my .message-bubble a { color: #FFFFFF; }

    .image-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.2s ease;
    }

    .image-viewer.show { display: flex; }

    .image-viewer img {
      max-width: 96%;
      max-height: 96%;
      border-radius: 8px;
      animation: popIn 0.25s ease;
    }

    .image-viewer .close-viewer {
      position: absolute;
      top: calc(20px + var(--safe-top));
      right: 24px;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 50%;
      color: #FFFFFF;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      backdrop-filter: blur(6px);
    }

    .image-viewer .close-viewer:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .image-viewer .download-btn {
      position: absolute;
      top: calc(20px + var(--safe-top));
      right: 84px;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 50%;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      backdrop-filter: blur(6px);
    }

    .image-viewer .download-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .image-viewer .download-btn svg {
      width: 22px;
      height: 22px;
    }

    .typing-indicator {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      color: var(--text-secondary);
      font-size: 13px;
      font-style: italic;
    }

    .typing-indicator.show { display: flex; }

    .typing-dots {
      display: inline-flex;
      gap: 3px;
    }

    .typing-dots span {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
      animation: typingBounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .edit-panel {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 28px;
      background: var(--bg-hover);
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-primary);
      animation: fadeIn 0.2s ease;
    }

    .edit-panel.show { display: flex; }

    .edit-panel .edit-icon {
      width: 20px;
      height: 20px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .edit-panel .edit-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .edit-panel .cancel-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 22px;
      padding: 0 8px;
      transition: color 0.2s;
    }

    .edit-panel .cancel-btn:hover { color: var(--danger); }

    .input-area {
      display: flex;
      align-items: flex-end;
      padding: 12px 24px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--bg-primary);
      gap: 8px;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .input-area.editing, .input-area.replying { border-top-color: var(--accent); }

    .input-area .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
      color: var(--accent);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .input-area .btn-icon:hover { background: var(--bg-hover); }
    .input-area .btn-icon:active { background: var(--bg-hover); }
    .input-area .btn-icon svg { width: 22px; height: 22px; }

    .input-area input {
      flex: 1;
      padding: 12px 18px;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      transition: border 0.2s, background 0.3s;
      min-width: 0;
      font-family: inherit;
    }

    .input-area input:focus { outline: none; border-color: var(--accent); }

    .input-area .btn-send {
      padding: 12px 24px;
      border: none;
      border-radius: 22px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      font-family: inherit;
    }

    .input-area .btn-send:hover { background: var(--accent-hover); }
    .input-area .btn-send:active { transform: scale(0.97); }
    .input-area .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-area .btn-send svg { width: 18px; height: 18px; }

    #file-input { display: none; }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadeIn 0.2s ease;
      padding: 20px;
      padding-top: calc(20px + var(--safe-top));
      padding-bottom: calc(20px + var(--safe-bottom));
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--bg-primary);
      border-radius: 16px;
      padding: 32px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px var(--shadow);
      border: 1px solid var(--border);
      animation: popIn 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal h2 { font-size: 22px; color: var(--text-primary); margin-bottom: 16px; }
    .modal .field { margin-bottom: 12px; }
    .modal .field label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 2px; }
    .modal .field .value { font-size: 16px; color: var(--text-primary); padding: 6px 0; border-bottom: 1px solid var(--border); }

    .modal .close-btn {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      font-family: inherit;
    }

    .modal .close-btn:hover { background: var(--accent-hover); }

    .profile-avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-avatar-big {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 38px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      border: 3px solid var(--border);
      transition: border-color 0.2s;
    }

    .profile-avatar-big:hover { border-color: var(--accent); }

    .profile-avatar-big img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-avatar-big .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.5);
      color: #FFFFFF;
      font-size: 11px;
      padding: 4px 0;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .profile-avatar-big:hover .overlay { opacity: 1; }

    .profile-avatar-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .profile-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .profile-action-btn {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg-primary);
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .profile-action-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
    }

    .profile-action-btn svg { width: 16px; height: 16px; }

    .password-form .field { margin-bottom: 10px; }

    .password-form input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px;
      transition: border 0.2s;
      font-family: inherit;
    }

    .password-form input:focus { outline: none; border-color: var(--accent); }

    .password-form .save-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
      font-family: inherit;
    }

    .password-form .save-btn:hover { background: var(--accent-hover); }

    .password-form .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 6px;
      min-height: 18px;
    }

    .password-form .success-msg {
      color: var(--accent);
      font-size: 13px;
      margin-top: 6px;
      min-height: 18px;
    }

    .settings-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .settings-field:last-of-type { border-bottom: none; }
    .settings-field .label { font-size: 15px; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
    .settings-field .desc { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .settings-field svg { width: 20px; height: 20px; color: var(--accent); }

    .toggle {
      width: 48px;
      height: 26px;
      background: var(--border);
      border-radius: 13px;
      cursor: pointer;
      position: relative;
      transition: background 0.25s;
      flex-shrink: 0;
    }

    .toggle.active { background: var(--accent); }

    .toggle .knob {
      width: 22px;
      height: 22px;
      background: #FFFFFF;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.25s;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    .toggle.active .knob { transform: translateX(22px); }

    .search-messages-panel {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 28px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }

    .search-messages-panel.show { display: flex; }

    .search-messages-panel input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
    }

    .search-messages-panel input:focus { outline: none; border-color: var(--accent); }

    .search-messages-panel .close-search {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 22px;
      padding: 0 6px;
    }

    .search-messages-panel .close-search:hover { color: var(--danger); }

    .search-messages-panel .search-count {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .message-wrapper.highlight { animation: highlight 1.5s ease; }

    @keyframes highlight {
      0%, 100% { background: transparent; }
      50% { background: rgba(124, 92, 252, 0.15); }
    }

    .reply-panel {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 10px 28px;
      background: var(--bg-hover);
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-primary);
      animation: fadeIn 0.2s ease;
    }

    .reply-panel.show { display: flex; }

    .reply-panel .reply-bar {
      width: 3px;
      height: 32px;
      background: var(--accent);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .reply-panel .reply-info {
      flex: 1;
      min-width: 0;
    }

    .reply-panel .reply-to-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    .reply-panel .reply-to-text {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reply-panel .cancel-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 22px;
      padding: 0 8px;
      transition: color 0.2s;
    }

    .reply-panel .cancel-btn:hover { color: var(--danger); }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        min-width: 0;
        height: 100vh;
        height: 100dvh;
        z-index: 100;
        border-right: none;
        transform: translateX(0);
        transition: transform 0.3s ease;
      }

      .sidebar.hidden {
        transform: translateX(-100%);
      }

      .chat-area {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        z-index: 50;
        transform: translateX(100%);
        transition: transform 0.3s ease;
      }

      .chat-area.visible {
        transform: translateX(0);
        z-index: 200;
      }

      .mobile-menu-btn,
      .mobile-back-btn {
        display: flex;
      }

      .chat-header {
        padding: 10px 12px;
        padding-top: calc(10px + var(--safe-top));
        min-height: 56px;
      }

      .chat-header .avatar {
        width: 38px;
        height: 38px;
        font-size: 15px;
        margin-right: 10px;
      }

      .chat-header .chat-contact-name { font-size: 16px; }
      .chat-header .chat-contact-status { font-size: 12px; }

      .header-action-btn {
        width: 36px;
        height: 36px;
        padding: 6px;
      }

      .header-action-btn svg { width: 18px; height: 18px; }

      .messages-area {
        padding: 12px 14px;
      }

      .message-wrapper { max-width: 88%; }

      .message-bubble {
        font-size: 15px;
        padding: 9px 14px;
        border-radius: 16px;
      }

      .message-bubble img { max-width: 200px; }

      .input-area {
        padding: 8px 10px;
        padding-bottom: calc(8px + var(--safe-bottom));
        gap: 4px;
      }

      .input-area input {
        font-size: 16px;
        padding: 10px 14px;
        border-radius: 20px;
      }

      .input-area .btn-send {
        padding: 10px 16px;
        font-size: 14px;
        border-radius: 20px;
        height: 40px;
      }

      .input-area .btn-send svg { width: 16px; height: 16px; }

      .input-area .btn-icon {
        width: 38px;
        height: 38px;
        padding: 6px;
      }

      .input-area .btn-icon svg { width: 20px; height: 20px; }

      .avatar { width: 42px; height: 42px; font-size: 16px; }

      .contact-item { padding: 12px 16px; }
      .contact-name { font-size: 15px; }
      .contact-sub { font-size: 12px; }

      .group-filter { padding: 8px 12px 4px; gap: 4px; }
      .group-btn { font-size: 12px; padding: 5px 12px; }

      .search-box { padding: 10px 12px 8px; }
      .search-box input { padding: 9px 12px; font-size: 16px; }

      .modal {
        padding: 24px 20px;
        width: 100%;
        max-width: none;
        border-radius: 14px;
        max-height: 88vh;
      }

      .profile-avatar-big {
        width: 80px;
        height: 80px;
        font-size: 30px;
      }

      .edit-panel, .reply-panel {
        padding: 8px 14px;
      }

      .search-messages-panel {
        padding: 8px 14px;
      }

      .sidebar-header {
        padding: 12px 16px 10px;
        padding-top: calc(12px + var(--safe-top));
      }

      .ithub-logo { height: 36px; }
      .sidebar-header-info { font-size: 11px; }

      .sidebar-footer { padding: 10px 12px; padding-bottom: calc(10px + var(--safe-bottom)); }
      .sidebar-footer-btn { font-size: 12px; padding: 9px 10px; }
      .sidebar-footer-btn svg { width: 15px; height: 15px; }

      .messages-area::-webkit-scrollbar { width: 3px; }
      .contacts-list::-webkit-scrollbar { width: 3px; }
    }

    @media (max-width: 420px) {
      .chat-header { padding: 8px 10px; padding-top: calc(8px + var(--safe-top)); }
      .chat-header .chat-contact-name { font-size: 15px; }
      .chat-header .chat-contact-status { font-size: 11px; }

      .message-bubble {
        font-size: 14px;
        padding: 8px 12px;
      }

      .input-area { padding: 6px 8px; padding-bottom: calc(6px + var(--safe-bottom)); }

      .contact-item { padding: 10px 14px; }
      .contact-name { font-size: 14px; }
      .contact-sub { font-size: 11px; }

      .sidebar-header { padding: 10px 14px 8px; padding-top: calc(10px + var(--safe-top)); }
      .sidebar-header-info { font-size: 11px; }

      .profile-avatar-big { width: 72px; height: 72px; font-size: 26px; }
      .modal { padding: 20px 16px; }

      .mobile-menu-btn, .mobile-back-btn {
        width: 36px;
        height: 36px;
      }

      .header-action-btn {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>

<div class="app-wrapper">

  <div class="login-container" id="login-container">
    <div class="login-card">
      <h1>Добро пожаловать!</h1>
      <p class="subtitle">Войдите в ITHub Messenger</p>
      <input type="email" id="email" placeholder="Email" autocomplete="username" />
      <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()" />
      <button onclick="login()">Войти</button>
      <div class="error-text" id="login-error"></div>
      <a href="#" class="forgot" onclick="alert('Обратитесь к администратору')">Забыли пароль?</a>
    </div>
  </div>

  <div class="messenger" id="messenger">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <svg class="ithub-logo" viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="8" width="20" height="20" fill="none" stroke-width="3" class="logo-dark"/>
          <rect x="11" y="15" width="6" height="6" class="logo-dark-fill"/>
          <path d="M 32 8 L 46 8 L 52 14 L 52 28 L 32 28 Z" fill="none" stroke-width="3" class="logo-dark"/>
          <rect x="4" y="32" width="20" height="20" fill="none" stroke-width="3" class="logo-dark"/>
          <rect x="32" y="32" width="20" height="20" fill="none" stroke-width="3" class="logo-dark"/>
          <text x="64" y="26" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" class="logo-dark-text">ITHub</text>
          <text x="64" y="49" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" class="logo-gray">MSG</text>
        </svg>
        <div class="sidebar-header-info" id="sidebar-user-info">Загрузка...</div>
      </div>

      <div class="group-filter" id="group-filter" style="display:none;"></div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Поиск контактов..." oninput="filterContacts()" />
      </div>
      <div class="contacts-list" id="contacts-list"></div>

      <div class="sidebar-footer">
        <button class="sidebar-footer-btn" onclick="openProfile()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Профиль
        </button>
        <button class="sidebar-footer-btn" onclick="openSettings()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Настройки
        </button>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="chat-header">
        <div class="chat-header-left">
          <button class="mobile-back-btn" onclick="backToContacts()" title="Назад">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
          <div class="avatar" id="chat-avatar" onclick="openContactProfile()" title="Открыть профиль">?</div>
          <div class="clickable-name" onclick="openContactProfile()">
            <div class="chat-contact-name" id="chat-contact-name">Выберите контакт</div>
            <div class="chat-contact-status" id="chat-contact-status">онлайн</div>
          </div>
        </div>

        <div class="chat-header-actions">
          <button class="header-action-btn" id="search-msg-btn" onclick="toggleSearchMessages()" title="Поиск по сообщениям" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </div>

      <div class="search-messages-panel" id="search-messages-panel">
        <input type="text" id="search-messages-input" placeholder="Поиск по сообщениям..." oninput="searchInMessages()" />
        <span class="search-count" id="search-messages-count"></span>
        <button class="close-search" onclick="toggleSearchMessages()">×</button>
      </div>

      <div class="messages-area" id="messages-area">
        <div class="no-messages">Выберите собеседника, чтобы начать чат</div>
      </div>

      <div class="typing-indicator" id="typing-indicator">
        <span id="typing-name"></span> печатает
        <span class="typing-dots"><span></span><span></span><span></span></span>
      </div>

      <div class="edit-panel" id="edit-panel">
        <svg class="edit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <div class="edit-text" id="edit-text">Редактирование сообщения</div>
        <button class="cancel-btn" onclick="cancelEdit()" title="Отменить">×</button>
      </div>

      <div class="reply-panel" id="reply-panel">
        <div class="reply-bar"></div>
        <div class="reply-info">
          <div class="reply-to-name" id="reply-to-name">Имя</div>
          <div class="reply-to-text" id="reply-to-text">Текст сообщения</div>
        </div>
        <button class="cancel-btn" onclick="cancelReply()" title="Отменить">×</button>
      </div>

      <div class="input-area" id="input-area">
        <button class="btn-icon" onclick="attachFile()" title="Прикрепить файл">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="text" id="message-input" placeholder="Сообщение..." disabled />
        <button class="btn-icon" onclick="toggleRecording()" title="Голосовое сообщение" id="voice-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button class="btn-send" id="send-btn" disabled onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

      <input type="file" id="file-input" multiple onchange="uploadFile(event)" />
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()">
    <h2 id="modal-title">Профиль</h2>
    <div id="modal-body"></div>
    <button class="close-btn" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<div class="image-viewer" id="image-viewer" onclick="closeImageViewer(event)">
  <button class="download-btn" onclick="downloadImage(event)" title="Скачать">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
  <button class="close-viewer" onclick="closeImageViewer(event)">×</button>
  <img id="image-viewer-img" src="" alt="" onclick="event.stopPropagation()" />
</div>

<input type="file" id="avatar-input" accept="image/*" style="display:none;" />

<script src="/socket.io/socket.io.js"></script>
<script>
  // ===== СОСТОЯНИЕ =====
  let currentUser = null;
  let contacts = [];
  let currentContactId = null;
  let socket = null;
  let unreadCounts = {};
  let isRecording = false;
  let mediaRecorder = null;
  let audioChunks = [];
  let pendingMessages = new Set();
  let messageCounter = 0;
  let selectedGroup = 'all';
  let editingMessage = null;
  let editingWrapper = null;
  let replyingTo = null;
  let onlineUsers = [];
  let typingTimer = null;
  let isTyping = false;
  let searchQuery = '';
  let currentImageUrl = '';

  // ===== DOM =====
  const loginContainer = document.getElementById('login-container');
  const messenger = document.getElementById('messenger');
  const sidebar = document.getElementById('sidebar');
  const chatArea = document.getElementById('chat-area');
  const contactsList = document.getElementById('contacts-list');
  const messagesArea = document.getElementById('messages-area');
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const chatContactName = document.getElementById('chat-contact-name');
  const chatContactStatus = document.getElementById('chat-contact-status');
  const chatAvatar = document.getElementById('chat-avatar');
  const sidebarUserInfo = document.getElementById('sidebar-user-info');
  const searchInput = document.getElementById('search-input');
  const fileInput = document.getElementById('file-input');
  const voiceBtn = document.getElementById('voice-btn');
  const loginError = document.getElementById('login-error');
  const editPanel = document.getElementById('edit-panel');
  const editText = document.getElementById('edit-text');
  const inputArea = document.getElementById('input-area');
  const avatarInput = document.getElementById('avatar-input');
  const typingIndicator = document.getElementById('typing-indicator');
  const typingName = document.getElementById('typing-name');
  const replyPanel = document.getElementById('reply-panel');
  const replyToName = document.getElementById('reply-to-name');
  const replyToText = document.getElementById('reply-to-text');
  const searchMessagesPanel = document.getElementById('search-messages-panel');
  const searchMessagesInput = document.getElementById('search-messages-input');
  const searchMessagesCount = document.getElementById('search-messages-count');
  const searchMsgBtn = document.getElementById('search-msg-btn');

  const imageViewer = document.getElementById('image-viewer');
  const imageViewerImg = document.getElementById('image-viewer-img');

  const modalOverlay = document.getElementById('modal-overlay');
  const modalTitle = document.getElementById('modal-title');
  const modalBody = document.getElementById('modal-body');

  // ===== ТЕМА =====
  function applyTheme() {
    const theme = localStorage.getItem('theme') || 'light';
    if (theme === 'dark') document.body.classList.add('dark');
    else document.body.classList.remove('dark');
  }
  applyTheme();

  // ===== МОБИЛЬНАЯ НАВИГАЦИЯ =====
  function isMobile() {
    return window.innerWidth <= 768;
  }

  function openChatMobile() {
    if (!isMobile()) return;
    sidebar.classList.add('hidden');
    chatArea.classList.add('visible');
  }

  function backToContacts() {
    sidebar.classList.remove('hidden');
    chatArea.classList.remove('visible');
  }

  window.addEventListener('resize', () => {
    if (!isMobile()) {
      sidebar.classList.remove('hidden');
      chatArea.classList.remove('visible');
    }
  });

  // ===== УВЕДОМЛЕНИЯ =====
  function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  function showNotification(fromName, text) {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    if (document.hasFocus()) return;
    if (localStorage.getItem('notifications') === 'false') return;

    try {
      const n = new Notification('ITHub — ' + fromName, {
        body: text,
        icon: '/icon-192.png',
        tag: 'ithub-msg'
      });
      setTimeout(() => n.close(), 5000);
    } catch (e) {
      console.error('Ошибка уведомления:', e);
    }
  }

  // ===== ПРОСМОТР ИЗОБРАЖЕНИЙ =====
  function openImageViewer(src) {
    currentImageUrl = src;
    imageViewerImg.src = src;
    imageViewer.classList.add('show');
  }

  function closeImageViewer(e) {
    if (e && e.target !== e.currentTarget && e.target.className !== 'close-viewer') return;
    imageViewer.classList.remove('show');
    imageViewerImg.src = '';
    currentImageUrl = '';
  }

  function downloadImage(e) {
    e.stopPropagation();
    if (!currentImageUrl) return;
    const a = document.createElement('a');
    a.href = currentImageUrl;
    a.download = currentImageUrl.split('/').pop();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (imageViewer.classList.contains('show')) {
        closeImageViewer();
      } else if (isMobile() && chatArea.classList.contains('visible')) {
        backToContacts();
      }
    }
  });

  // ===== РЕНДЕР АВАТАРКИ =====
  function renderAvatar(el, user, size) {
    el.innerHTML = '';
    const inner = document.createElement('div');
    inner.className = 'avatar-inner';

    if (user.avatar) {
      const img = document.createElement('img');
      img.src = '/uploads/' + user.avatar;
      inner.appendChild(img);
    } else {
      inner.textContent = getInitials(user.fullName);
    }
    el.appendChild(inner);

    if (size === 'small') {
      const online = onlineUsers.find(u => u.id === user.id);
      if (online && (online.status === 'online' || online.status === 'away')) {
        const dot = document.createElement('span');
        dot.className = 'online-dot ' + online.status;
        el.appendChild(dot);
      }
    }
  }

  function renderChatAvatar() {
    if (!currentContactId) return;
    const contact = contacts.find(c => c.id === currentContactId);
    if (!contact) return;

    chatAvatar.innerHTML = '';
    const inner = document.createElement('div');
    inner.className = 'avatar-inner';

    if (contact.avatar) {
      const img = document.createElement('img');
      img.src = '/uploads/' + contact.avatar;
      inner.appendChild(img);
    } else {
      inner.textContent = getInitials(contact.fullName);
    }
    chatAvatar.appendChild(inner);
  }

  function getStatusText(userId) {
    const online = onlineUsers.find(u => u.id === userId);
    if (online) {
      if (online.status === 'online') return { text: 'в сети', color: 'var(--online)' };
      if (online.status === 'away') return { text: 'отошёл', color: 'var(--away)' };
    }
    const contact = contacts.find(c => c.id === userId);
    if (contact && contact.lastSeen) {
      return { text: 'был(а) ' + formatLastSeen(contact.lastSeen), color: 'var(--text-secondary)' };
    }
    return { text: 'не в сети', color: 'var(--text-secondary)' };
  }

  function formatLastSeen(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'только что';
    if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ч назад';
    return d.toLocaleDateString('ru-RU');
  }

  function updateChatHeaderStatus() {
    if (!currentContactId) return;
    const contact = contacts.find(c => c.id === currentContactId);
    if (!contact) return;

    const sub = contact.role === 'teacher' ? 'Преподаватель' : 'Студент';
    const st = getStatusText(contact.id);
    chatContactStatus.textContent = `${sub} · ${st.text}`;
    chatContactStatus.style.color = st.color;
  }

  // ===== ВХОД =====
  function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      loginError.textContent = 'Введите email и пароль';
      return;
    }

    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: email, password })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          currentUser = data.user;
          loginError.textContent = '';
          loginContainer.style.display = 'none';
          messenger.style.display = 'flex';
          messenger.style.flex = '1';

          sidebarUserInfo.textContent = `${currentUser.fullName} (${currentUser.role === 'teacher' ? 'Преподаватель' : 'Студент'})`;

          requestNotificationPermission();

          socket = io();
          socket.emit('join', currentUser.id);

          loadContacts();

          socket.on('message', (msg) => {
            if (msg.from_user === currentUser.id) {
              if (msg.tempId) {
                const wrapper = messagesArea.querySelector(`[data-temp-id="${msg.tempId}"]`);
                if (wrapper) {
                  wrapper.dataset.msgId = msg.id;
                  wrapper.removeAttribute('data-temp-id');
                }
              }
              return;
            }

            if (msg.from_user === currentContactId) {
              addMessage(msg, 'other');
              socket.emit('mark-read', { from: msg.from_user, to: currentUser.id });
            } else {
              if (!unreadCounts[msg.from_user]) unreadCounts[msg.from_user] = 0;
              unreadCounts[msg.from_user]++;
              renderContacts();
              updateTitle();
              const sender = contacts.find(c => c.id === msg.from_user);
              if (sender) showNotification(sender.fullName, msg.text || 'Вложение');
            }
          });

          socket.on('messages-read', (data) => {
            if (data.by === currentContactId) {
              messagesArea.querySelectorAll('.message-wrapper.my').forEach(w => {
                const st = w.querySelector('.message-status');
                if (st) {
                  st.textContent = '✓✓';
                  st.classList.add('read');
                }
              });
            }
          });

          socket.on('message-edited', (data) => {
            const wrapper = messagesArea.querySelector(`[data-msg-id="${data.id}"]`);
            if (!wrapper) return;
            const bubble = wrapper.querySelector('.message-bubble');
            const textNode = Array.from(bubble.childNodes).find(n => n.nodeType === 3);
            if (textNode) textNode.textContent = data.text;
            if (!bubble.querySelector('.message-edited')) {
              const edited = document.createElement('span');
              edited.className = 'message-edited';
              edited.textContent = '(изменено)';
              bubble.appendChild(edited);
            }
          });

          socket.on('message-deleted', (data) => {
            const wrapper = messagesArea.querySelector(`[data-msg-id="${data.id}"]`);
            if (wrapper) wrapper.remove();
          });

          socket.on('avatar-updated', (data) => {
            const contact = contacts.find(c => c.id === data.userId);
            if (contact) {
              contact.avatar = data.avatar;
              renderContacts();
            }
            if (currentContactId === data.userId) renderChatAvatar();
          });

          socket.on('online-users', (users) => {
            onlineUsers = users;
            renderContacts();
            if (currentContactId) updateChatHeaderStatus();
          });

          socket.on('user-typing', (data) => {
            if (data.from === currentContactId) {
              const contact = contacts.find(c => c.id === data.from);
              typingName.textContent = contact ? contact.fullName : 'Собеседник';
              typingIndicator.classList.add('show');
            }
          });

          socket.on('user-stop-typing', (data) => {
            if (data.from === currentContactId) {
              typingIndicator.classList.remove('show');
            }
          });

          window.addEventListener('focus', () => { if (socket) socket.emit('back', currentUser.id); });
          window.addEventListener('blur', () => { if (socket) socket.emit('away', currentUser.id); });

          messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              if (editingMessage) saveEdit();
              else sendMessage();
            }
            if (e.key === 'Escape') {
              if (editingMessage) cancelEdit();
              else if (replyingTo) cancelReply();
            }
          });

          messageInput.addEventListener('input', handleTyping);
          document.addEventListener('paste', handlePaste);

        } else {
          loginError.textContent = 'Неверный логин или пароль';
        }
      })
      .catch(err => {
        console.error('Ошибка входа:', err);
        loginError.textContent = 'Ошибка соединения с сервером';
      });
  }

  function handlePaste(e) {
    if (!currentContactId) return;
    const items = e.clipboardData?.items;
    if (!items) return;

    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (!file) continue;
        sendFileFromBlob(file, 'screenshot_' + Date.now() + '.png');
        return;
      }
    }
  }

  function handleTyping() {
    if (!socket || !currentContactId) return;
    if (!isTyping) {
      isTyping = true;
      socket.emit('typing', { from: currentUser.id, to: currentContactId });
    }
    if (typingTimer) clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      isTyping = false;
      socket.emit('stop-typing', { from: currentUser.id, to: currentContactId });
    }, 2000);
  }

  function logout() {
    if (socket) socket.disconnect();
    currentUser = null;
    currentContactId = null;
    selectedGroup = 'all';
    onlineUsers = [];
    messenger.style.display = 'none';
    loginContainer.style.display = 'flex';
    document.title = 'ITHub Мессенджер';
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    loginError.textContent = '';
    pendingMessages.clear();
    sidebar.classList.remove('hidden');
    chatArea.classList.remove('visible');
  }

  function openProfile() {
    modalTitle.textContent = 'Профиль';

    const avatarHtml = currentUser.avatar
      ? `<img src="/uploads/${currentUser.avatar}" />`
      : getInitials(currentUser.fullName);

    modalBody.innerHTML = `
      <div class="profile-avatar-section">
        <div class="profile-avatar-big" onclick="chooseAvatar()">
          ${avatarHtml}
          <div class="overlay">Сменить</div>
        </div>
        <div class="profile-avatar-hint">Нажмите, чтобы сменить аватарку</div>
      </div>
      <div class="field"><label>Имя</label><div class="value">${currentUser.fullName}</div></div>
      <div class="field"><label>Роль</label><div class="value">${currentUser.role === 'teacher' ? 'Преподаватель' : 'Студент'}</div></div>
      <div class="field"><label>Email</label><div class="value">${currentUser.login}</div></div>
      ${currentUser.role === 'teacher' ? `
        <div class="field"><label>Группы</label><div class="value">${currentUser.groups ? currentUser.groups.join(', ') : '—'}</div></div>
        <div class="field"><label>Предметы</label><div class="value">${currentUser.subjects ? currentUser.subjects.join(', ') : '—'}</div></div>
      ` : `
        <div class="field"><label>Группа</label><div class="value">${currentUser.group || '—'}</div></div>
      `}
      <div class="profile-actions">
        <button class="profile-action-btn" onclick="openPasswordForm()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Сменить пароль
        </button>
      </div>
    `;
    modalOverlay.classList.add('show');
  }

  function chooseAvatar() { avatarInput.click(); }

  avatarInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    console.log('Загружаю аватарку:', file.name, file.size, 'байт', file.type);

    if (file.size > 10 * 1024 * 1024) {
      alert('Файл слишком большой (максимум 10 МБ)');
      avatarInput.value = '';
      return;
    }

    if (!file.type.startsWith('image/')) {
      alert('Можно загружать только изображения');
      avatarInput.value = '';
      return;
    }

    const formData = new FormData();
    formData.append('avatar', file);
    formData.append('userId', currentUser.id);

    fetch('/upload-avatar', { 
      method: 'POST', 
      body: formData
    })
      .then(res => {
        if (!res.ok) throw new Error('Сервер ответил: ' + res.status);
        return res.json();
      })
      .then(data => {
        if (data.success) {
          currentUser.avatar = data.filename;
          const bigAvatar = document.querySelector('.profile-avatar-big');
          if (bigAvatar) {
            bigAvatar.innerHTML = `<img src="/uploads/${data.filename}" /><div class="overlay">Сменить</div>`;
          }
          alert('Аватарка обновлена!');
        } else {
          alert('Не удалось загрузить: ' + (data.error || 'неизвестная ошибка'));
        }
      })
      .catch(err => {
        console.error('Ошибка загрузки аватарки:', err);
        alert('Ошибка соединения: ' + err.message);
      });

    avatarInput.value = '';
  });

  function openPasswordForm() {
    modalBody.innerHTML = `
      <div class="password-form">
        <div class="field">
          <label>Текущий пароль</label>
          <input type="password" id="old-password" placeholder="Введите текущий пароль" />
        </div>
        <div class="field">
          <label>Новый пароль</label>
          <input type="password" id="new-password" placeholder="Минимум 4 символа" />
        </div>
        <div class="field">
          <label>Повторите новый пароль</label>
          <input type="password" id="confirm-password" placeholder="Повторите пароль" />
        </div>
        <button class="save-btn" onclick="changePassword()">Сохранить</button>
        <div class="error-msg" id="password-error"></div>
        <div class="success-msg" id="password-success"></div>
        <div style="margin-top:12px; text-align:center;">
          <button class="profile-action-btn" onclick="openProfile()" style="width:100%;">← Назад к профилю</button>
        </div>
      </div>
    `;
  }

  function changePassword() {
    const oldPass = document.getElementById('old-password').value;
    const newPass = document.getElementById('new-password').value;
    const confirmPass = document.getElementById('confirm-password').value;
    const errorEl = document.getElementById('password-error');
    const successEl = document.getElementById('password-success');
    errorEl.textContent = '';
    successEl.textContent = '';

    if (!oldPass || !newPass || !confirmPass) { errorEl.textContent = 'Заполните все поля'; return; }
    if (newPass.length < 4) { errorEl.textContent = 'Новый пароль должен быть минимум 4 символа'; return; }
    if (newPass !== confirmPass) { errorEl.textContent = 'Пароли не совпадают'; return; }
    if (newPass === oldPass) { errorEl.textContent = 'Новый пароль совпадает со старым'; return; }

    fetch('/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: currentUser.id, oldPassword: oldPass, newPassword: newPass })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          successEl.textContent = 'Пароль успешно изменён!';
          document.getElementById('old-password').value = '';
          document.getElementById('new-password').value = '';
          document.getElementById('confirm-password').value = '';
          setTimeout(() => openProfile(), 1500);
        } else {
          errorEl.textContent = data.error || 'Не удалось изменить пароль';
        }
      })
      .catch(err => {
        console.error('Ошибка смены пароля:', err);
        errorEl.textContent = 'Ошибка соединения';
      });
  }

  function openContactProfile() {
    if (!currentContactId) return;
    const contact = contacts.find(c => c.id === currentContactId);
    if (!contact) return;

    modalTitle.textContent = 'Профиль';
    const avatarHtml = contact.avatar
      ? `<img src="/uploads/${contact.avatar}" />`
      : getInitials(contact.fullName);
    const st = getStatusText(contact.id);

    let fieldsHtml = `
      <div class="profile-avatar-section">
        <div class="profile-avatar-big" style="cursor:default;">${avatarHtml}</div>
      </div>
      <div class="field"><label>Статус</label><div class="value" style="color:${st.color}">${st.text}</div></div>
      <div class="field"><label>Имя</label><div class="value">${contact.fullName}</div></div>
      <div class="field"><label>Роль</label><div class="value">${contact.role === 'teacher' ? 'Преподаватель' : 'Студент'}</div></div>
      <div class="field"><label>Email</label><div class="value">${contact.login || '—'}</div></div>
    `;
    if (contact.role === 'teacher') {
      fieldsHtml += `
        <div class="field"><label>Группы</label><div class="value">${contact.groups && contact.groups.length ? contact.groups.join(', ') : '—'}</div></div>
        <div class="field"><label>Предметы</label><div class="value">${contact.subjects && contact.subjects.length ? contact.subjects.join(', ') : '—'}</div></div>
      `;
    } else {
      fieldsHtml += `<div class="field"><label>Группа</label><div class="value">${contact.group || '—'}</div></div>`;
    }
    modalBody.innerHTML = fieldsHtml;
    modalOverlay.classList.add('show');
  }

  function openSettings() {

  function toggleTheme(el) {
    el.classList.toggle('active');
    const isDark = el.classList.contains('active');
    if (isDark) {
      document.body.classList.add('dark');
      localStorage.setItem('theme', 'dark');
    } else {
      document.body.classList.remove('dark');
      localStorage.setItem('theme', 'light');
    }
  }

  function toggleNotifications(el) {
    el.classList.toggle('active');
    localStorage.setItem('notifications', el.classList.contains('active'));
  }

  function closeModal(event) {
    if (event && event.target !== event.currentTarget) return;
    modalOverlay.classList.remove('show');
  }

  function loadContacts() {
    fetch(`/contacts?userId=${currentUser.id}`)
      .then(res => res.json())
      .then(data => {
        contacts = data;
        renderGroupFilter();
        renderContacts();
        if (currentContactId) {
          const stillExists = contacts.some(c => c.id === currentContactId);
          if (!stillExists) { currentContactId = null; clearChat(); }
        }
      })
      .catch(err => console.error('Ошибка загрузки контактов:', err));
  }

  function renderGroupFilter() {
    const container = document.getElementById('group-filter');
    if (currentUser.role !== 'teacher') {
      container.style.display = 'none';
      return;
    }
    container.style.display = 'flex';
    container.innerHTML = '';

    const groupsSet = new Set();
    contacts.forEach(c => {
      if (c.role === 'student' && c.group) groupsSet.add(c.group);
    });
    const groups = Array.from(groupsSet).sort();

    const allBtn = document.createElement('button');
    allBtn.className = 'group-btn' + (selectedGroup === 'all' ? ' active' : '');
    allBtn.textContent = 'Все';
    allBtn.onclick = () => selectGroup('all');
    container.appendChild(allBtn);

    groups.forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'group-btn' + (selectedGroup === g ? ' active' : '');
      btn.textContent = g;
      btn.onclick = () => selectGroup(g);
      container.appendChild(btn);
    });
  }

  function selectGroup(group) {
    selectedGroup = group;
    renderGroupFilter();
    renderContacts();
  }

  function renderContacts() {
    contactsList.innerHTML = '';

    let filteredContacts = contacts;
    if (currentUser.role === 'teacher' && selectedGroup !== 'all') {
      filteredContacts = contacts.filter(c => c.group === selectedGroup);
    }

    filteredContacts.forEach(contact => {
      const div = document.createElement('div');
      div.className = 'contact-item';
      if (contact.id === currentContactId) div.classList.add('active');

      const subLabel = contact.role === 'teacher'
        ? (contact.groups ? contact.groups.join(', ') : 'Преподаватель')
        : (contact.group || 'Студент');

      const unread = unreadCounts[contact.id] || 0;

      div.dataset.name = contact.fullName;
      div.dataset.sub = subLabel;
      div.dataset.group = contact.group || '';

      const avatarEl = document.createElement('div');
      avatarEl.className = 'avatar';
      renderAvatar(avatarEl, contact, 'small');

      const infoEl = document.createElement('div');
      infoEl.className = 'contact-info';
      infoEl.innerHTML = `
        <div class="contact-name">${contact.fullName}</div>
        <div class="contact-sub">${subLabel}</div>
      `;

      div.appendChild(avatarEl);
      div.appendChild(infoEl);

      if (unread > 0) {
        const badge = document.createElement('div');
        badge.className = 'contact-badge';
        badge.textContent = unread;
        div.appendChild(badge);
      }

      div.addEventListener('click', () => {
        if (unreadCounts[contact.id]) {
          delete unreadCounts[contact.id];
          updateTitle();
          renderContacts();
        }
        openChat(contact.id);
      });

      contactsList.appendChild(div);
    });

    if (filteredContacts.length === 0 && contacts.length > 0) {
      contactsList.innerHTML = `<div style="padding:20px;color:var(--text-secondary);text-align:center;">В этой группе нет студентов</div>`;
    } else if (contacts.length === 0) {
      contactsList.innerHTML = `<div style="padding:20px;color:var(--text-secondary);text-align:center;">Нет контактов</div>`;
    }

    filterContacts();
  }

  function filterContacts() {
    const query = searchInput.value.toLowerCase().trim();
    const items = contactsList.querySelectorAll('.contact-item');
    items.forEach(item => {
      const name = item.dataset.name?.toLowerCase() || '';
      const sub = item.dataset.sub?.toLowerCase() || '';
      const itemGroup = item.dataset.group || '';

      let groupMatch = true;
      if (currentUser.role === 'teacher' && selectedGroup !== 'all') {
        groupMatch = itemGroup === selectedGroup;
      }
      const textMatch = name.includes(query) || sub.includes(query);
      item.style.display = (groupMatch && textMatch) ? 'flex' : 'none';
    });
  }

  function updateTitle() {
    const total = Object.values(unreadCounts).reduce((a, b) => a + b, 0);
    document.title = total > 0 ? `ITHub (${total})` : 'ITHub Мессенджер';
  }

  function openChat(contactId) {
    currentContactId = contactId;
    const contact = contacts.find(c => c.id === contactId);
    if (!contact) return;

    chatContactName.textContent = contact.fullName;
    renderChatAvatar();
    updateChatHeaderStatus();
    searchMsgBtn.style.display = 'flex';

    messageInput.disabled = false;
    sendBtn.disabled = false;

    document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
    const items = contactsList.querySelectorAll('.contact-item');
    const idx = Array.from(items).findIndex(el => el.dataset.name === contact.fullName);
    if (idx !== -1 && items[idx]) items[idx].classList.add('active');

    searchMessagesPanel.classList.remove('show');
    searchMessagesInput.value = '';
    searchQuery = '';

    loadMessages(contactId);

    socket.emit('mark-read', { from: contactId, to: currentUser.id });

    openChatMobile();

    setTimeout(() => messageInput.focus(), 350);
